<title>Planet B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Nunito:wght@400..800&display=swap">
<style>
/* Layout: eine Spalte fürs Handy. Oben Quote und Uhr, dann der Planet als Kugel, darunter Bewohnerin, Hausmitteilung (Karte) und Bauplatz.
   Bewusst nur eine dunkle Bildwelt (Weltraum). Gold = Profit, Grün = Natur, Rot = Kleingedrucktes. */
:root {
  color-scheme: dark;
  --bg: #0c0e1d;
  --panel: #181b31;
  --panel-2: #22264a;
  --line: #333a6a;
  --ink: #eef0ff;
  --ink-soft: #a3a8cc;
  --profit: #ffb43a;
  --profit-ink: #2a1600;
  --nature: #7ed36a;
  --harm: #ff8a78;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 28px; display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, #stage:focus-visible { outline: 3px solid var(--profit); outline-offset: 2px; }

.hud { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.pname { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; display: flex; align-items: baseline; gap: 8px; }
.pname small { font-family: var(--f-body); font-weight: 700; font-size: .72rem; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; }
.clock { font-family: var(--f-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; grid-row: span 2; }
.clock small { display: block; font-family: var(--f-body); font-size: .7rem; font-weight: 700; color: var(--ink-soft); letter-spacing: .05em; text-transform: uppercase; margin-top: 3px; }
.quota { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar { flex: 1; height: 10px; background: var(--panel-2); border: 2px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--profit) 0 6px, #e8962a 6px 8px); }
.quota span { font-family: var(--f-display); font-size: .9rem; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-soft); }
.cash { display: flex; gap: 14px; align-items: baseline; font-variant-numeric: tabular-nums; }
.cash b { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; color: var(--profit); }
.cash span { color: var(--ink-soft); font-weight: 700; font-size: .85rem; }
.snd { margin-left: auto; background: none; border: 2px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: .78rem; font-weight: 700; color: var(--ink-soft); }

#stage { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); background: #070814; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#scene { display: block; width: 100%; height: auto; aspect-ratio: 1; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.toast { position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 6px); background: rgba(8, 9, 20, .86); border: 1px solid var(--line); color: var(--ink); font-weight: 700; font-size: .85rem; padding: 6px 12px; border-radius: 999px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.over { position: absolute; inset: 0; display: grid; place-items: end center; background: linear-gradient(rgba(7, 8, 20, 0) 45%, rgba(7, 8, 20, .85)); padding: 12px; }
.over .box { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px 8px; text-align: center; max-width: 340px; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.over h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; margin: 0; line-height: 1; }
.over p { margin: 0; color: var(--ink-soft); font-size: .85rem; }
.over .boni { font-size: .8rem; color: var(--nature); }

.go { font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; padding: 10px 14px; border-radius: 10px; border: 0; background: var(--profit); color: var(--profit-ink); box-shadow: 0 4px 0 #a8661a; }
.go:active { transform: translateY(2px); box-shadow: 0 2px 0 #a8661a; }
.link { background: none; border: 0; color: var(--ink-soft); font-size: .78rem; text-decoration: underline; padding: 4px; }

.folk { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; background: var(--panel); border-radius: 10px; padding: 8px 10px; }
.folk .face { width: 64px; height: 72px; display: grid; place-items: end center; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
.folk .face svg { width: 62px; height: 70px; }
.folk .empty { font-family: var(--f-display); font-size: .7rem; color: var(--ink-soft); padding-bottom: 26px; }
.folk .who { font-size: .75rem; font-weight: 800; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }
.folk .say { margin: 2px 0 4px; font-size: .95rem; min-height: 2.6em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .74rem; font-weight: 800; padding: 1px 8px; border-radius: 4px; background: var(--panel-2); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.memo { background: #f3ead2; color: #2a2014; border-radius: 6px; padding: 10px 12px 12px; box-shadow: 0 3px 0 #b8a87a; display: flex; flex-direction: column; gap: 6px; animation: memo .35s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes memo { from { transform: translateY(14px) rotate(-1deg); opacity: 0; } to { transform: none; opacity: 1; } }
.memo .from { font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #8a7a5a; display: flex; justify-content: space-between; }
.memo h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; margin: 0; line-height: 1.1; }
.memo p { margin: 0; font-size: .9rem; }
.memo .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
.opt { border-radius: 8px; padding: 8px; text-align: left; border: 2px solid #b8a87a; background: #fffaf0; color: #2a2014; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt b { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
.opt .gain { font-weight: 800; font-size: .8rem; }
.opt .fine { font-size: .72rem; font-style: italic; color: #a04a3a; }
.opt.fast { background: var(--profit); border-color: #a8661a; box-shadow: 0 3px 0 #a8661a; }
.opt.fast .fine { color: #7a2a1a; }

.field { background: var(--panel); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.field h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.field h3 small { font-family: var(--f-body); font-size: .78rem; font-weight: 700; color: var(--ink-soft); }
.field p { margin: 0; color: var(--ink-soft); font-size: .88rem; }
.build { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.build b { font-weight: 800; }
.build .cost { grid-row: span 2; font-family: var(--f-display); font-size: 1.15rem; color: var(--profit); font-variant-numeric: tabular-nums; }
.build .fine { font-size: .74rem; font-style: italic; color: var(--harm); }
.build .gain { font-size: .8rem; font-weight: 700; color: var(--nature); }
.build:disabled { opacity: .5; cursor: default; }
.build:disabled .cost { color: var(--ink-soft); }

.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; }
.sheet .in { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet .big { font-family: var(--f-display); font-weight: 700; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.sheet .eyebrow { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.sheet .rec { color: var(--profit); font-weight: 800; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair figure { margin: 0; background: #070814; border-radius: 10px; padding: 8px; text-align: center; }
.pair img { width: 100%; max-width: 100%; image-rendering: pixelated; display: block; }
.pair figcaption { font-size: .75rem; font-weight: 800; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel); border-radius: 8px; padding: 8px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.stat small { font-size: .72rem; color: var(--ink-soft); font-weight: 700; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rank li { display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; background: var(--panel); border-radius: 6px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.rank li.me { outline: 2px solid var(--profit); }
.rank .t { font-family: var(--f-display); font-weight: 600; }
.rank .h { color: var(--ink-soft); font-size: .8rem; }
.picks { display: flex; flex-direction: column; gap: 6px; }
.pick { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; }
.pick b { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
.pick small { color: var(--ink-soft); }
.pick[aria-pressed="true"] { border-color: var(--profit); background: #2e2a2a; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.foot { font-size: .74rem; color: var(--ink-soft); text-align: center; margin: 0; }

.fig .p24-blink { opacity: 0; animation: blink 4.6s steps(1) infinite; }
.fig .sp-u { animation: breath 1.8s steps(1) infinite; }
@keyframes blink { 0%, 94% { opacity: 0; } 95%, 98% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes breath { 0%, 55% { transform: translateY(0); } 56%, 100% { transform: translateY(1px); } }
@media (prefers-reduced-motion: reduce) { .fig .p24-blink, .fig .sp-u, .memo { animation: none; } }
</style>

<div class="app" id="app">
  <header class="hud">
    <div class="pname"><span id="pname">Planet B</span><small id="pquota">Quote 5.000</small></div>
    <div class="clock" id="clock">0:00.0<small>Zeit</small></div>
    <div class="quota"><div class="bar"><i id="qbar"></i></div><span id="qtxt">0 %</span></div>
  </header>
  <div class="cash"><span>Kasse <b id="cash">0</b></span><span id="rate">+0/s</span><button class="snd" id="snd" aria-pressed="true">Ton an</button></div>

  <div id="stage" tabindex="0" aria-label="Der Planet. Tippe auf ein Feld am Rand.">
    <canvas id="scene" width="112" height="112"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <div class="over" id="startOver">
      <div class="box">
        <h1 id="sTitle">Planet B</h1>
        <p id="sText">Die Zentrale erwartet 5.000 Einheiten. So schnell wie möglich.</p>
        <p class="boni" id="sBoni" hidden></p>
        <button class="go" id="land">Landen</button>
        <p id="sBest"></p>
        <button class="link" id="wipe">Fortschritt löschen</button>
      </div>
    </div>
  </div>

  <section class="folk" aria-live="polite">
    <div class="face" id="face"></div>
    <div style="min-width:0">
      <div class="who">Paula, Bürgermeisterin</div>
      <p class="say" id="say"></p>
      <div class="chips"><span class="chip" id="cVill">Bewohner 24</span><span class="chip" id="cFauna">Tierarten 3</span></div>
    </div>
  </section>

  <section class="memo" id="memo" hidden></section>
  <section class="field" id="field"></section>
  <p class="foot">Prototyp „Planet B“. Bestzeiten bleiben nur in diesem Browser.</p>
</div>

<section class="sheet" id="end" hidden><div class="in" id="endIn"></div></section>

const keyNow = () => Math.round(G.hp / 2) + '|' + G.seed;

// Teilchen: Rauch, Funken, Vögel
let parts = [];
function emitSmoke(x, y, nx, ny, dark) { parts.push({ x, y, vx: nx * 4 + (Math.random() - .5) * 2, vy: ny * 4 + (Math.random() - .5) * 2, life: 2.2 + Math.random(), age: 0, c: dark ? [60, 54, 50] : [190, 186, 182], a: dark ? .8 : .6 }); }

function slotAng(i) { return i * Math.PI * 2 / 12; }
function drawSlot(s, t) {

    drawOnRim(SPR.saege, ang, h, { map: ch => ch === 'o' ? 'N' : ch });

    const f = Math.floor(t * 8) % 2;
    drawOnRim({ base: 7, rows: f ? ['.m.m.', 'mmMmm', '.MkM.', 'mmMmm', '.m.m.', '.....', '.....'] : ['m.m.m', '.mMm.', 'mMkMm', '.mMm.', 'm.m.m', '.....', '.....'] }, ang, h, { du: -5 });
  } else if (s.b === 'mine') {
    drawOnRim(SPR.mine, ang, h);
  } else if (s.b === 'bohr') {
    const flick = Math.floor(t * 10) % 3;
    drawOnRim(s.t === 'see' ? SPR.bohrSee : SPR.bohr, ang, h, { map: ch => ch === 'F' ? (flick === 0 ? 'Y' : 'F') : ch });
  } else if (s.t === 'wald') {
    drawOnRim(SPR.wald, ang, h, { map: leafy });

  } else if (s.t === 'dorf') {

  } else if (SPR[s.t]) {

let lastSmoke = 0;
function draw(dt, now) {
  const t = now / 1000;

  // Sterne funkeln
  STARS.forEach(([x, y, r], i) => { if (r > .7 && Math.sin(t * 2 + i) > .7 && Math.hypot(x - CX, y - CY) > R + 3) put(x, y, [255, 255, 255]); });
  const h = G.hp / 100, smog = clamp(1 - h, 0, 1);
  // Smog hinter dem Rand
  G.slots.forEach(s => drawSlot(s, t));
  // Bewohner laufen am Dorf hin und her
  const dorfs = G.slots.filter(s => s.t === 'dorf');
  if (dorfs.length && G.vill > 0) {
    const per = Math.ceil(G.vill / dorfs.length / 2);
    dorfs.forEach((s, k) => {
      const ang = slotAng(s.i);
      for (let i = 0; i < per; i++) {
        const du = Math.sin(t * (.4 + i * .13) + i * 2 + k) * 8, hop = (mood() === 'froh' || mood() === 'werbung') && Math.sin(t * 6 + i) > .92 ? 1 : 0;
        const [x0, y0] = rimPoint(ang, .5 + hop, du), [x1, y1] = rimPoint(ang, 1.5 + hop, du), [x2, y2] = rimPoint(ang, 2.5 + hop, du);
        const shirt = [PRGB.i, PRGB.q, PRGB.F, PRGB.v][(i + k) % 4];
        put(x0, y0, [60, 50, 60]); put(x1, y1, shirt); put(x2, y2, PRGB.j);

  }
  // Fische springen aus dem See
  const see = G.slots.find(s => s.t === 'see');
  if (see && G.fauna.fisch) { const k = (t % 4.5) / 1.1; if (k < 1) { const [x, y] = rimPoint(slotAng(see.i), Math.sin(k * Math.PI) * 5 - 1, (k - .5) * 8); put(x, y, [255, 150, 90]); put(x + 1, y, [240, 120, 70]); } }

    lastSmoke = 0;
    G.slots.forEach(s => {
      const ang = slotAng(s.i), nx = Math.sin(ang), ny = -Math.cos(ang);
      if (s.b && Math.random() < .12 + .12 * s.lv) { const lift = s.b === 'bohr' ? 14 : s.b === 'mine' ? 11 : 9; const du = s.b === 'mine' ? 7 : s.b === 'saege' ? -6 : 0; const [x, y] = rimPoint(ang, lift, du); emitSmoke(x, y, nx, ny, s.b !== 'saege'); }

      if (s.t === 'dorf' && !s.b && G.vill > 0 && Math.random() < .12) { const [x, y] = rimPoint(ang, 10, -6); emitSmoke(x, y, nx, ny, false); }
      if (s.t === 'asche' && G.fire > 0 && Math.random() < .8) { const [x, y] = rimPoint(ang, 2 + Math.random() * 4, (Math.random() - .5) * 14); parts.push({ x, y, vx: nx * 6, vy: ny * 6, life: .7, age: 0, c: Math.random() < .5 ? [255, 180, 60] : [255, 110, 50], a: 1 }); }
    });

    const x = CX + Math.sin(a) * rr, y = CY - Math.cos(a) * rr;
    [[0, 0], [1, 0], [2, 0], [3, 0], [-1, 0], [1, -1], [2, -1], [0, 1], [1, 1], [2, 1], [-1, 1], [3, 1], [4, 1]].forEach(([dx, dy]) => blend(x + dx, y + dy, cloudC, .85));

    const ang = slotAng(G.sel);
    drawOnRim({ base: 0, rows: ['YYYYY', '.YYY.', '..Y..'] }, ang, 1, { lift: 19 });

// ===================== Ablauf =====================
function snapshot() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(cv, 0, 0);
  return c.toDataURL();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.25, (now - last) / 1000); last = now;
  step_(dt);
  draw(dt, now);
  if (!document.hidden) requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { last = performance.now(); requestAnimationFrame(frame); } });

let uiT = 0, lineT = 0, lineIdx = 0, lastMood = '';
function step_(dt) {
  if (G.phase === 'landing') { G.anim = Math.min(1, G.anim + dt / 1.6); if (G.anim >= 1) { G.phase = 'play'; G.before = null; setTimeout(() => { G.before = snapshot(); }, 60); toast('Gelandet. Die Uhr läuft.'); renderField(); } }

    G.time += dt;
    const r = rateOf(); earn(r * dt);
    let pol = 0; G.slots.forEach(s => { if (s.b) pol += BUILD[s.b].pol * s.lv; });
    hurt(pol * G.polM * dt);
    if (G.ad > 0) G.ad -= dt;
    if (G.fire > 0) G.fire -= dt;
    villCheck(); faunaCheck();
    if (!G.card) { G.nextCard -= dt; if (G.nextCard <= 0) dealCard(); }
    if (G.total >= G.quota) finish();
  } else if (G.phase === 'launch') {
    G.anim = Math.min(1, G.anim + dt / 2.6);

  }

  if (uiT > .1) { uiT = 0; renderHud(); }

function dealCard() {

  G.used[c.id] = 1; G.card = c; sfx('memo'); renderMemo();

function act(slotI, kind) {
  const s = G.slots[slotI]; if (G.phase !== 'play') return;

  } else {
    const c = costOf(kind); if (G.cash < c) { sfx('no'); return; }

// ===================== Ende =====================

  const entry = { t: +G.time.toFixed(1), hp: Math.round(G.hp), v: G.vill, d: new Date().toLocaleDateString('de-DE') };
  const prevBest = list[0] ? list[0].t : null;
  list.push(entry); list.sort((a, b) => a.t - b.t); S.best[n] = list.slice(0, 5); save();
  const rec = prevBest === null || entry.t < prevBest;
  allowed = G.time <= PAR ? 2 : 1;
  const r = rng(hashStr('offer' + n + Date.now())); offer = Object.keys(BONI).sort(() => r() - .5).slice(0, 3); picks = [];
  const fauna = [['hirsch', 'Hirsche'], ['vogel', 'Vögel'], ['fisch', 'Fische']];
  const left = fauna.filter(([k]) => G.fauna[k]).map(([, l]) => l);
  $('endIn').innerHTML = `
    <div><div class="eyebrow">${nameOf(n)} · Quote erfüllt</div><div class="big">${fmtT(G.time)}</div>
      <div>${rec ? '<span class="rec">Neue Bestzeit!</span>' : `Bestzeit ${fmtT(prevBest)}`} · ${G.time <= PAR ? 'Unter 3:00, zwei Boni.' : 'Über 3:00, ein Bonus.'}</div></div>
    <div class="pair"><figure>${G.before ? `<img src="${G.before}" alt="Der Planet bei der Landung">` : ''}<figcaption>Bei der Landung</figcaption></figure><figure><img src="${G.after}" alt="Der Planet beim Abflug"><figcaption>Beim Abflug</figcaption></figure></div>
    <div class="stats"><div class="stat"><b>${G.vill} / 24</b><small>Bewohner geblieben</small></div><div class="stat"><b>${left.length} / 3</b><small>${left.length ? left.join(', ') : 'Tierarten'}</small></div><div class="stat"><b>${Math.round(G.hp)} %</b><small>Planet beim Abflug</small></div></div>
    <div><div class="eyebrow">Deine Zeiten auf ${nameOf(n)}</div><ol class="rank">${S.best[n].map((b, i) => `<li class="${b === entry ? 'me' : ''}"><span>${i + 1}.</span><span class="t">${fmtT(b.t)}</span><span class="h">Planet ${b.hp} %</span></li>`).join('')}</ol></div>
    <div><div class="eyebrow">Für den nächsten Planeten: wähle ${allowed}</div><div class="picks" id="picks">${offer.map(k => `<button class="pick" data-pick="${k}" aria-pressed="false"><b>${BONI[k].name}</b><small>${BONI[k].text}</small></button>`).join('')}</div></div>
    <div class="row"><button class="go" id="next" disabled>Weiter zu ${nameOf(n + 1)}</button><button class="link" id="again">${nameOf(n)} nochmal, ohne Bonus</button></div>`;
  $('end').hidden = false; $('end').scrollTop = 0;
  musicOn = false;
}
$('end').addEventListener('click', e => {
  const p = e.target.closest('[data-pick]');
  if (p) {
    const k = p.dataset.pick, i = picks.indexOf(k);
    if (i >= 0) picks.splice(i, 1); else { picks.push(k); if (picks.length > allowed) picks.shift(); }
    document.querySelectorAll('[data-pick]').forEach(b => b.setAttribute('aria-pressed', String(picks.includes(b.dataset.pick))));
    $('next').disabled = picks.length !== allowed;
  }
  if (e.target.id === 'next' && picks.length === allowed) { S.boni = S.boni.concat(picks); S.planet = G.n + 1; save(); restart(); }
  if (e.target.id === 'again') restart();
});
function restart() { $('end').hidden = true; parts = []; newPlanet(); renderStart(); renderField(); renderHud('line'); window.scrollTo(0, 0); }

// ===================== Eingaben =====================
$('land').addEventListener('click', () => { audio(); musicOn = true; $('startOver').hidden = true; G.phase = 'landing'; G.anim = 0; renderField(); });
let wipeArm = 0;
$('wipe').addEventListener('click', e => {
  if (Date.now() - wipeArm < 3000) { const snd = S.sound; S = freshSave(); S.sound = snd; save(); restart(); e.target.textContent = 'Fortschritt löschen'; wipeArm = 0; toast('Alles auf Anfang.'); return; }
  wipeArm = Date.now(); e.target.textContent = 'Wirklich? Nochmal tippen'; setTimeout(() => { e.target.textContent = 'Fortschritt löschen'; }, 3000);
});
$('stage').addEventListener('pointerdown', e => {
  if (G.phase !== 'play' || e.target.closest('.over')) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy);
  if (d < R - 16 || d > R + 26) return;
  let a = Math.atan2(dx, -dy); if (a < 0) a += Math.PI * 2;
  G.sel = Math.round(a / (Math.PI * 2 / 12)) % 12; renderField();
});
$('stage').addEventListener('keydown', e => { if (G.phase !== 'play') return; if (e.key === 'ArrowRight') { G.sel = (G.sel + 1) % 12; renderField(); } if (e.key === 'ArrowLeft') { G.sel = (G.sel + 11) % 12; renderField(); } });
$('field').addEventListener('click', e => { const b = e.target.closest('[data-build]'), u = e.target.closest('[data-up]'); if (b) act(G.sel, b.dataset.build); if (u) act(+u.dataset.up, 'up'); });
$('memo').addEventListener('click', e => { const b = e.target.closest('[data-ans]'); if (b) answer(b.dataset.ans); });
$('snd').addEventListener('click', () => { S.sound = !S.sound; save(); $('snd').textContent = S.sound ? 'Ton an' : 'Ton aus'; $('snd').setAttribute('aria-pressed', String(S.sound)); if (S.sound) audio(); else if (AC) AC.suspend(); });
$('snd').textContent = S.sound ? 'Ton an' : 'Ton aus'; $('snd').setAttribute('aria-pressed', String(S.sound));

newPlanet(); renderStart(); renderField(); renderHud('line');
requestAnimationFrame(frame);
})();
</script>
