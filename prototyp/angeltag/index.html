<title>Angel-Tag im Hafen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Nunito:wght@400..800&display=swap">
<style>
/* Layout: eine Spalte fürs Handy. Oben die Pixel-Szene (Himmel nach echter Uhrzeit), darunter Stellen, ein großer Daumen-Knopf, dann Reiter.
   Bewusst nur eine Bildwelt: Die Farben folgen der Tageszeit (Morgen, Tag, Abend, Nacht), nicht dem Hell/Dunkel-Modus. */
:root {
  color-scheme: light;
  --bg: #e4f0ee;          /* Grund, wechselt mit der Tageszeit */
  --paper: #fbf3e2;       /* Tafeln */
  --paper-2: #f1e3c4;     /* vertiefte Flächen */
  --ink: #3b2615;         /* Schrift, dunkles Holz */
  --ink-soft: #7a5b40;
  --wood: #8a5a34;        /* Knöpfe, Rahmen */
  --wood-dark: #5c3a1f;
  --buoy: #d8483b;        /* Schwimmer-Rot: der eine Akzent */
  --buoy-ink: #fff6ea;
  --sea: #2f86a6;
  --ok: #4f8a3c;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
body.ph-morgen { --bg: #f6e3d2; --sea: #4a789e; }
body.ph-tag    { --bg: #dcefee; --sea: #2f86a6; }
body.ph-abend  { --bg: #f1d2bf; --sea: #4a4a78; --paper: #fbefe2; }
body.ph-nacht  { color-scheme: dark; --bg: #141a33; --paper: #222a4a; --paper-2: #1a2140; --ink: #efe6d2; --ink-soft: #a9a7c0; --wood: #a07448; --wood-dark: #e0b07a; --sea: #1a2850; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; transition: background .8s ease; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 28px; display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .stage:focus-visible { outline: 3px solid var(--buoy); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.clock { font-family: var(--f-display); font-size: 1.15rem; background: none; border: 0; padding: 4px 0; text-align: left; user-select: none; }
.clock small { display: block; font-family: var(--f-body); font-size: .72rem; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; }
.parts { display: flex; gap: 10px; font-family: var(--f-display); font-size: 1rem; font-variant-numeric: tabular-nums; }
.parts span { display: inline-flex; align-items: center; gap: 3px; }
.pi { width: 18px; height: 18px; image-rendering: pixelated; flex: none; }
.snd { background: none; border: 2px solid var(--wood); border-radius: 6px; padding: 2px 8px; font-size: .8rem; font-weight: 700; color: var(--ink-soft); }

.stage { position: relative; border-radius: 10px; overflow: hidden; border: 3px solid var(--wood-dark); box-shadow: 0 4px 0 var(--wood-dark); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#scene { display: block; width: 100%; height: auto; aspect-ratio: 180 / 150; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.toast { position: absolute; left: 50%; top: 10px; transform: translate(-50%, -6px); background: rgba(30, 20, 12, .82); color: #fff6ea; font-weight: 700; font-size: .88rem; padding: 6px 12px; border-radius: 999px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.catch { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20, 14, 8, .38); }
.card { background: var(--paper); color: var(--ink); border: 3px solid var(--wood-dark); border-radius: 10px; padding: 14px 18px 12px; text-align: center; min-width: 0; width: min(86%, 300px); animation: pop .35s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.card img { width: 140px; max-width: 100%; image-rendering: pixelated; animation: wiggle .5s steps(2) 3; }
@keyframes wiggle { 0% { transform: rotate(-6deg); } 100% { transform: rotate(6deg); } }
.card h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.45rem; margin: 4px 0 0; text-wrap: balance; }
.card .size { font-family: var(--f-display); font-size: 1.1rem; color: var(--ink-soft); }
.card .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 4px; }
.tag { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--paper-2); }
.tag.new { background: var(--buoy); color: var(--buoy-ink); }
.tag.rare { background: #d9a640; color: #3b2615; }
.card p { margin: 6px 0 0; font-size: .9rem; color: var(--ink-soft); }
.card .hint { margin-top: 10px; font-size: .78rem; opacity: .8; }

.spots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.spot { border: 2px solid var(--wood); background: var(--paper); border-radius: 8px; padding: 6px 4px; text-align: center; min-width: 0; }
.spot b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
.spot small { display: block; font-size: .7rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spot[aria-pressed="true"] { background: var(--wood); border-color: var(--wood-dark); color: var(--paper); box-shadow: inset 0 -3px 0 var(--wood-dark); }
.spot[aria-pressed="true"] small { color: var(--paper-2); }
.spot.quiet small { color: var(--buoy); font-weight: 700; }
.spot[aria-pressed="true"].quiet small { color: #ffd9c8; }

.cast { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; padding: 14px 10px; border-radius: 12px; border: 3px solid #7a2a22; background: var(--buoy); color: var(--buoy-ink); box-shadow: 0 5px 0 #7a2a22; transition: transform .06s; }
.cast:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a2a22; }
.cast.wait { background: var(--sea); border-color: #10283a; box-shadow: 0 5px 0 #10283a; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; border-bottom: 3px solid var(--wood); margin-top: 6px; }
.tab { background: none; border: 0; padding: 8px 2px 6px; font-weight: 800; font-size: .86rem; color: var(--ink-soft); border-radius: 8px 8px 0 0; position: relative; }
.tab[aria-selected="true"] { background: var(--wood); color: var(--paper); }
.tab .dot { position: absolute; top: 4px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--buoy); }
.panel { background: var(--paper); border-radius: 0 0 10px 10px; padding: 12px; margin-top: -10px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; margin: 0; }
.muted { color: var(--ink-soft); font-size: .85rem; margin: 0; }

.res { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: start; padding: 8px; background: var(--paper-2); border-radius: 8px; }
.res .face { width: 72px; height: 82px; display: grid; place-items: end center; background: linear-gradient(var(--paper-2), var(--paper)); border-radius: 6px; }
.res .face svg { width: 70px; height: 80px; }
.res .who { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
.res .who small { font-family: var(--f-body); font-weight: 600; font-size: .78rem; color: var(--ink-soft); }
.res .say { margin: 2px 0 6px; font-size: .9rem; }
.res .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.res .want { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: .85rem; }
.res .want img { width: 44px; image-rendering: pixelated; }
.btn { border: 2px solid var(--wood-dark); background: var(--wood); color: var(--paper); font-weight: 800; font-size: .88rem; padding: 6px 12px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--wood); }
.reward { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; font-weight: 700; color: var(--ink-soft); }
.done { color: var(--ok); font-weight: 800; font-size: .85rem; }
body.ph-nacht .done { color: #9ad08a; }

.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--paper-2); border-radius: 8px; }
.item img { width: 56px; image-rendering: pixelated; flex: none; }
.item .txt { flex: 1; min-width: 0; }
.item .txt b { display: block; }
.item .txt small { color: var(--ink-soft); }
.cost { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--f-display); font-size: .95rem; }
.cost span { display: inline-flex; align-items: center; gap: 2px; }
.cost .lack { color: var(--buoy); }

.cat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.cell { background: var(--paper-2); border-radius: 8px; padding: 8px; text-align: center; min-width: 0; }
.cell img { width: 80px; max-width: 100%; image-rendering: pixelated; }
.cell b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.2; }
.cell small { display: block; font-size: .74rem; color: var(--ink-soft); }
.cell.open b { color: var(--ink-soft); }
body.ph-nacht img.sil { filter: brightness(2.6) opacity(.6); }
.cell.rare-c { box-shadow: inset 0 0 0 2px #d9a640; }

.test { border: 2px dashed var(--wood); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.test .row { display: flex; gap: 6px; flex-wrap: wrap; }
.test .btn[aria-pressed="true"] { background: var(--buoy); border-color: #7a2a22; }
.foot { font-size: .75rem; color: var(--ink-soft); text-align: center; margin: 4px 0 0; }

.fig .p24-blink { opacity: 0; animation: blink 4.6s steps(1) infinite; }
.fig .sp-u { animation: breath 1.8s steps(1) infinite; }
@keyframes blink { 0%, 94% { opacity: 0; } 95%, 98% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes breath { 0%, 55% { transform: translateY(0); } 56%, 100% { transform: translateY(1px); } }
@media (prefers-reduced-motion: reduce) { .fig .p24-blink, .fig .sp-u, .card img { animation: none; } .card { animation: none; } }
</style>

<div class="app">
  <header class="top">
    <button class="clock" id="clock" aria-label="Uhrzeit">--:--<small>Tag</small></button>
    <div class="parts" id="parts" aria-label="Bauteile"></div>
    <button class="snd" id="snd" aria-pressed="true">Ton an</button>
  </header>

  <div class="stage" id="stage" tabindex="0" aria-label="Angelplatz. Tippen zum Auswerfen und Anschlagen.">
    <canvas id="scene" width="180" height="150"></canvas>
    <div class="toast" id="toast" role="status"></div>
    <div class="catch" id="catch" hidden></div>
  </div>

  <div class="spots" id="spots"></div>
  <button class="cast" id="cast">Auswerfen</button>

  <section class="test" id="test" hidden>
    <b>Testregler</b>
    <div class="row" id="phaseBtns"></div>
    <div class="row">
      <button class="btn ghost" id="tNewDay">Neuer Tag (neue Wünsche)</button>
      <button class="btn ghost" id="tCalm">Ruhe aufheben</button>
      <button class="btn ghost" id="tReset">Alles löschen</button>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="bewohner">Bewohner</button>
    <button class="tab" role="tab" data-tab="eimer">Eimer</button>
    <button class="tab" role="tab" data-tab="bauen">Bauen</button>
    <button class="tab" role="tab" data-tab="katalog">Katalog</button>
  </nav>
  <section class="panel" id="panel" role="tabpanel"></section>
  <p class="foot">Prototyp „Ein Angel-Tag im Hafen“. Gespeichert wird nur in diesem Browser.</p>
</div>

  const P = PAL[phase()], hi = mix(P.sea[0], '#ffffff', .45);
  ctx.fillStyle = hi;
  for (let i = 0; i < 22; i++) { const r = rng(77 + i); const y = HORIZON + 4 + Math.floor(r() * (H - HORIZON - 6)); const sp = .4 + r() * .8; const x = Math.round((r() * W + t / 1000 * sp * 3) % (W + 10)) - 5; const on = (Math.sin(t / 900 + i) + 1) / 2; if (on > .35) ctx.fillRect(x, y, 2 + (i % 3), 1); }
}

// ================= Angeln =================
// Zustände: idle, fly (Wurf), wait (Schwimmer liegt), bite (Fenster zum Tippen), reel (Fang fliegt), card
let G = { st: 'idle', t0: 0, nib: [], biteAt: 0, fx: [], dip: 0, fish: null, quiet: false };
const WINDOW = 620;
function spotState(id) { return S.spots[id] || (S.spots[id] = { n: 0, until: 0 }); }
function isQuiet(id) { const s = spotState(id); return s.until > Date.now(); }
function quietMin(id) { return Math.max(1, Math.ceil((spotState(id).until - Date.now()) / 60000)); }

function pickFish(spot) {
  const p = phase(), pool = FISH.filter(f => f.spots.includes(spot) && f.ph.includes(p));
  let sum = pool.reduce((a, f) => a + f.w, 0), r = Math.random() * sum;
  for (const f of pool) { r -= f.w; if (r <= 0) return f; } return pool[0];
}
function cast() {
  audio();
  G = { st: 'fly', t0: performance.now(), nib: [], biteAt: 0, fx: [], dip: 0, fish: null, quiet: isQuiet(S.spot) };
  SFX.cast(); updCast();
  // Fehlalarme 1–3, dann der echte Biss
  let at = 520 + rand(900, 2000);
  const n = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) { G.nib.push(at); at += rand(900, 2300); }
  G.biteAt = G.quiet ? Infinity : at;
  if (G.quiet) G.nib = G.nib.slice(0, 1);
}
function strike(now) {
  const dt = now - G.t0;
  if (G.st === 'bite') {
    if (dt - G.biteAt <= WINDOW) { hook(); return; }
  }
  if (G.st === 'wait' || G.st === 'fly') {
    const nibbling = G.nib.some(n => dt >= n && dt < n + 400);
    toast(nibbling ? 'Zu früh! Das war nur ein Anstupser.' : 'Nichts dran. Erst warten, bis er abtaucht.');
    SFX.miss(); reset(); return;
  }
  reset();
}
function hook() {
  const sp = S.spot, f = pickFish(sp);
  const size = Math.round(f.min + (f.max - f.min) * Math.pow(Math.random(), 1.6));
  G.st = 'reel'; G.t0 = performance.now(); G.fish = { f, size };
  SFX.catch(); buzz(30); updCast();
}
function reset() { G = { st: 'idle', t0: 0, nib: [], biteAt: 0, fx: [], dip: 0, fish: null }; updCast(); }
function landed() {
  const { f, size } = G.fish, sp = S.spot;
  const c = S.cat[f.id] || { n: 0, best: 0 };
  const isNew = c.n === 0, rec = !isNew && size > c.best;
  c.n++; c.best = Math.max(c.best, size); S.cat[f.id] = c;
  S.bucket.push({ id: f.id, size });
  let drift = null;
  if (Math.random() < .3) { const r = Math.random(); drift = r < .5 ? 'holz' : r < .8 ? 'seil' : 'glas'; S.parts[drift]++; }
  const st = spotState(sp); st.n++;
  let quietNow = false;
  if (st.n >= QUIET_AFTER) { st.n = 0; st.until = Date.now() + QUIET_MIN * 60000; quietNow = true; }
  save();
  G.st = 'card'; updCast();
  const tags = [isNew ? '<span class="tag new">Neu im Katalog</span>' : '', rec ? '<span class="tag">Neuer Rekord</span>' : '', f.rare ? '<span class="tag rare">Selten</span>' : ''].join('');
  const wish = activeWishFor(f.id);
  $('catch').innerHTML = `<div class="card"><img src="${FISH_IMG[f.id]}" alt=""><h2>${f.name}</h2><div class="size">${size} cm</div><div class="tags">${tags}</div><p>${f.note}</p>${drift ? `<p>${partIcon(drift)} Am Haken hing noch etwas ${PARTS[drift]}.</p>` : ''}${wish ? `<p><b>${RES[wish].name}</b> wünscht sich genau den!</p>` : ''}${quietNow ? `<p>Am ${SPOT_NAME[sp]} wird es jetzt ruhig. Woanders probieren?</p>` : (st.n === QUIET_AFTER - 1 ? `<p>Die Fische am ${SPOT_NAME[sp]} werden langsam vorsichtig.</p>` : '')}<div class="hint">Tippen: ab in den Eimer</div></div>`;
  $('catch').hidden = false;
  render();
}
function closeCard() { $('catch').hidden = true; reset(); render(); }

function act(e) {
  if (e) e.preventDefault();
  const now = performance.now();
  if (G.st === 'card') { closeCard(); return; }
  if (G.st === 'reel') return;
  if (G.st === 'idle') { cast(); return; }
  strike(now);
}
function updCast() {
  const b = $('cast');
  const lbl = { idle: 'Auswerfen', fly: 'Anschlagen', wait: 'Anschlagen', bite: 'Anschlagen', reel: 'Hab ihn!', card: 'Weiter' }[G.st];
  b.textContent = lbl; b.classList.toggle('wait', G.st === 'fly' || G.st === 'wait' || G.st === 'bite');
}

// ================= Zeichnen =================
function draw(now) {
  if (bgPhase !== phase() || bgBuilt !== JSON.stringify(S.built)) buildBg();
  const t = Date.now();
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgSky, 0, 0);
  drawSky(t); drawWater(t);
  ctx.drawImage(bgFront, 0, 0);
  const p = phase();
  if (S.built.laterne && (p === 'abend' || p === 'nacht')) { const fl = .16 + Math.sin(t / 300) * .03; ctx.globalAlpha = fl; ctx.fillStyle = '#ffd970'; for (let r = 14; r > 2; r -= 4) { ctx.beginPath(); ctx.arc(10.5, 48.5, r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; for (let y = 78; y < 98; y += 3) { ctx.fillStyle = 'rgba(255,217,112,.45)'; ctx.fillRect(8 + ((y + (t >> 8)) % 3), y, 4, 1); } }

  const g = spotGeo(S.spot);
  const dt = now - G.t0;
  const pull = G.st === 'reel' || G.st === 'bite';
  const [tx, ty] = drawAngler(g, t, pull);
  const lineCol = p === 'nacht' ? 'rgba(220,230,255,.55)' : 'rgba(255,255,255,.75)';

  if (G.st === 'fly' || G.st === 'wait' || G.st === 'bite') {
    let bx = g.bx, by = g.by;
    if (G.st === 'fly') {
      const k = Math.min(1, dt / 520);
      bx = tx + (g.bx - tx) * k; by = ty + (g.by - ty) * k - Math.sin(k * Math.PI) * 26;
      if (k >= 1) { G.st = 'wait'; SFX.plop(); G.fx.push({ x: g.bx, y: g.by + 2, t: now }); }
    }
    if (G.st === 'wait') {
      G.nib.forEach((n, i) => { if (dt >= n && !G['n' + i]) { G['n' + i] = 1; SFX.nibble(); G.fx.push({ x: g.bx, y: g.by + 2, t: now, small: 1 }); } });
      if (dt >= G.biteAt) { G.st = 'bite'; SFX.bite(); buzz(60); G.fx.push({ x: g.bx, y: g.by + 2, t: now }, { x: g.bx, y: g.by + 2, t: now + 120 }); }
      if (G.quiet && dt > 7000) { toast(`Am ${SPOT_NAME[S.spot]} beißt gerade nichts. Woanders probieren?`); reset(); }
    }
    if (G.st === 'bite' && dt - G.biteAt > WINDOW) { toast('Weg ist er. Der Köder auch.'); SFX.miss(); reset(); }
    const nib = G.st === 'wait' && G.nib.some(n => dt >= n && dt < n + 260);
    const bob = Math.round(Math.sin(now / 420) * .6);
    const sink = G.st === 'bite' ? 3 : nib ? 1 : 0;
    curve(tx, ty, bx, by, G.st === 'fly' ? 2 : 8, lineCol);
    // Schwimmer 3 × 5: rot oben, weiß unten, im Wasser abgeschnitten
    const yb = Math.round(by) + (G.st === 'fly' ? 0 : bob + sink), xb = Math.round(bx) - 1;
    const rows = [['', '#d8483b', ''], ['#d8483b', '#ff7a6a', '#d8483b'], ['#d8483b', '#d8483b', '#d8483b'], ['#f4f0e8', '#ffffff', '#f4f0e8'], ['', '#f4f0e8', '']];
    rows.forEach((r, y) => { if (G.st !== 'fly' && yb - 3 + y > Math.round(by) + 1) return; r.forEach((c, x) => { if (c) { ctx.fillStyle = c; ctx.fillRect(xb + x, yb - 3 + y, 1, 1); } }); });
    if (G.st !== 'fly') { ctx.fillStyle = mix(PAL[p].sea[1], '#ffffff', .3); ctx.fillRect(xb - 1, Math.round(by) + 2, 5, 1); }
    if (G.st === 'bite') { ctx.fillStyle = '#ffffff'; [[-3, -1], [4, -2], [-2, -3], [3, 0]].forEach(([x, y]) => { if (Math.floor(now / 90) % 2) ctx.fillRect(xb + 1 + x, Math.round(by) + y, 1, 1); }); }
  }
  if (G.st === 'reel' && G.fish) {
    const k = Math.min(1, dt / 750), img = FISH_CV[G.fish.f.id];
    const x = g.bx + (g.ax - g.bx) * k, y = g.by + (g.ay - 18 - g.by) * k - Math.sin(k * Math.PI) * 34;
    curve(tx, ty, x, y, 0, lineCol);
    ctx.save(); const flip = Math.floor(now / 110) % 2 ? 1 : -1; ctx.translate(Math.round(x), Math.round(y)); ctx.scale(flip * .7, .7); ctx.drawImage(img, -img.width / 2, -img.height / 2); ctx.restore();
    if (k >= 1) landed();
  }
  if (G.st === 'card') curve(tx, ty, g.ax, g.ay - 18, 0, lineCol);
  // Wellenringe
  G.fx = (G.fx || []).filter(fx => now - fx.t < 900);
  G.fx.forEach(fx => { const k = (now - fx.t) / 900; if (k < 0) return; ellipse(fx.x, fx.y, (fx.small ? 1.5 : 2) + k * (fx.small ? 3 : 6), '#ffffff', (1 - k) * .8); });
}

let last = 0;
function loop(now) {
  const busy = G.st !== 'idle' && G.st !== 'card';
  if (now - last >= (busy ? 33 : 90)) { last = now; draw(now); }
  if (!document.hidden) requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { requestAnimationFrame(loop); render(); } });

// ================= Wünsche =================
function ensureWishes() {
  const d = today();
  if (S.wishes && S.wishes.day === d) return;
  const r = rng(hashStr(d + (S.wishSalt || '')));
  const p = realPhase();
  // Santo will etwas, das es jetzt gerade irgendwo gibt; Pipo etwas Beliebiges (mit Ortstipp)
  const nowPool = RES.santo.pool.filter(id => FISH_BY[id].ph.includes(S.phase || p));
  const a = (nowPool.length ? nowPool : RES.santo.pool)[Math.floor(r() * (nowPool.length || RES.santo.pool.length))];
  const bPool = RES.pipo.pool.filter(id => id !== a);
  const b = bPool[Math.floor(r() * bPool.length)];
  S.wishes = { day: d, list: [{ who: 'santo', fish: a, done: false }, { who: 'pipo', fish: b, done: false }] };
  save();
}
function activeWishFor(fid) { ensureWishes(); const w = S.wishes.list.find(w => !w.done && w.fish === fid); return w && w.who; }
function give(i) {
  const w = S.wishes.list[i], idx = S.bucket.findIndex(b => b.id === w.fish);
  if (idx < 0 || w.done) return;
  S.bucket.splice(idx, 1); w.done = true;
  Object.entries(RES[w.who].reward).forEach(([k, n]) => { S.parts[k] += n; });
  save(); SFX.catch(); render();
  toast(`${RES[w.who].name} freut sich riesig!`);
}

// ================= Oberfläche =================
let tab = 'bewohner';
try { tab = sessionStorage.getItem('angeltag.tab') || tab; } catch (e) {}
function render() {
  ensureWishes();
  const p = phase();
  document.body.className = 'ph-' + p;
  const d = new Date();
  $('clock').innerHTML = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}<small>${S.phase ? 'Test: ' : ''}${PH_NAME[p]}</small>`;
  $('parts').innerHTML = Object.keys(PARTS).map(k => `<span title="${PARTS[k]}">${partIcon(k)}${S.parts[k]}</span>`).join('');
  $('snd').textContent = S.sound ? 'Ton an' : 'Ton aus'; $('snd').setAttribute('aria-pressed', String(!!S.sound));
  $('spots').innerHTML = SPOTS.map(s => {
    const q = isQuiet(s.id), here = FISH.filter(f => f.spots.includes(s.id) && f.ph.includes(p)).length;
    return `<button class="spot${q ? ' quiet' : ''}" data-spot="${s.id}" aria-pressed="${S.spot === s.id}"><b>${s.name}</b><small>${q ? `ruhig, noch ${quietMin(s.id)} Min` : `${here} Arten jetzt`}</small></button>`;
  }).join('');
  const giveable = S.wishes.list.some(w => !w.done && S.bucket.some(b => b.id === w.fish));
  const buildable = BUILDS.some(b => !S.built[b.id] && Object.entries(b.cost).every(([k, n]) => S.parts[k] >= n));
  [...$('tabs').children].forEach(b => {
    const id = b.dataset.tab; b.setAttribute('aria-selected', String(id === tab));
    const label = { bewohner: 'Bewohner', eimer: `Eimer ${S.bucket.length}`, bauen: 'Bauen', katalog: `Katalog ${Object.keys(S.cat).length}/8` }[id];
    const dot = (id === 'bewohner' && giveable) || (id === 'bauen' && buildable);
    b.innerHTML = label + (dot ? '<span class="dot"></span>' : '');
  });
  $('phaseBtns').innerHTML = [['', 'Echt']].concat(PHASES.map(x => [x, PH_NAME[x]])).map(([k, n]) => `<button class="btn ghost" data-ph="${k}" aria-pressed="${(S.phase || '') === k}">${n}</button>`).join('');
  $('panel').innerHTML = ({ bewohner: panelRes, eimer: panelBucket, bauen: panelBuild, katalog: panelCat })[tab]();
}
function panelRes() {
  return S.wishes.list.map((w, i) => {
    const R = RES[w.who], f = FISH_BY[w.fish], has = S.bucket.some(b => b.id === w.fish);
    const svg = (typeof FIGS !== "undefined" && FIGS[R.fig]) ? FIGS[R.fig][w.done ? 'f' : 'n'] : '';
    const rew = Object.entries(R.reward).map(([k, n]) => `${partIcon(k)}${n}`).join(' ');
    return `<div class="res"><div class="face">${svg}</div><div style="min-width:0"><div class="who">${R.name} <small>${R.role}</small></div>
      <p class="say">${w.done ? R.thanks : R.ask(f)}</p>
      <div class="row">${w.done ? `<span class="done">Wunsch erfüllt</span>` : `<span class="want"><img ${S.cat[f.id] ? '' : 'class="sil" '}src="${S.cat[f.id] ? FISH_IMG[f.id] : FISH_SIL[f.id]}" alt="">${f.name}</span><button class="btn" data-give="${i}" ${has ? '' : 'disabled'}>${has ? 'Geben' : 'Noch nicht im Eimer'}</button>`}</div>
      ${w.done ? '' : `<div class="reward">Dafür gibt's ${rew}</div>`}</div></div>`;
  }).join('') + `<p class="muted">Neue Wünsche gibt es morgen.</p>`;
}
function panelBucket() {
  if (!S.bucket.length) return `<h3>Der Eimer ist leer</h3><p class="muted">Wirf aus! Warte, bis der Schwimmer richtig abtaucht, dann schnell tippen. Ein kurzes Zucken ist nur ein Anstupser.</p>`;
  const groups = {};
  S.bucket.forEach(b => { (groups[b.id] = groups[b.id] || []).push(b.size); });
  return `<div class="list">` + Object.entries(groups).map(([id, sizes]) => { const f = FISH_BY[id]; return `<div class="item"><img src="${FISH_IMG[id]}" alt=""><div class="txt"><b>${f.name} × ${sizes.length}</b><small>größter ${Math.max(...sizes)} cm</small></div><button class="btn ghost" data-free="${id}">Freilassen</button></div>`; }).join('') + `</div>`;
}
function panelBuild() {
  return `<p class="muted">Bauteile gibt's von den Bewohnern. Manchmal hängt auch was am Haken.</p><div class="list">` + BUILDS.map(b => {
    const done = !!S.built[b.id], can = Object.entries(b.cost).every(([k, n]) => S.parts[k] >= n);
    return `<div class="item"><div class="txt"><b>${b.name}</b><small>${b.text}</small><div class="cost">${costHtml(b.cost, !done)}</div></div>${done ? '<span class="done">Steht</span>' : `<button class="btn" data-build="${b.id}" ${can ? '' : 'disabled'}>Bauen</button>`}</div>`;
  }).join('') + `</div>`;
}
function panelCat() {
  return `<div class="cat">` + FISH.map(f => {
    const c = S.cat[f.id];
    const where = `${f.spots.map(s => SPOT_NAME[s]).join(', ')} · ${f.ph.length === 4 ? 'immer' : f.ph.map(x => PH_NAME[x]).join(', ')}`;
    return c ? `<div class="cell${f.rare ? ' rare-c' : ''}"><img src="${FISH_IMG[f.id]}" alt=""><b>${f.name}</b><small>${c.n}× gefangen, Rekord ${c.best} cm</small><small>${where}</small></div>`
      : `<div class="cell open"><img class="sil" src="${FISH_SIL[f.id]}" alt=""><b>???</b><small>${where}</small></div>`;
  }).join('') + `</div>`;
}

let toastT = 0;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

// ================= Eingaben =================
$('stage').addEventListener('pointerdown', e => { if (e.button && e.button !== 0) return; act(e); });
$('cast').addEventListener('pointerdown', e => { if (e.button && e.button !== 0) return; act(e); });
$('cast').addEventListener('click', e => e.preventDefault());
document.addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && (e.target === document.body || e.target.id === 'stage' || e.target.id === 'cast')) act(e); });
$('spots').addEventListener('click', e => { const b = e.target.closest('[data-spot]'); if (!b || b.dataset.spot === S.spot) return; if (G.st === 'card') closeCard(); S.spot = b.dataset.spot; save(); reset(); render(); if (isQuiet(S.spot)) toast(`Am ${SPOT_NAME[S.spot]} ist es noch ruhig.`); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; try { sessionStorage.setItem('angeltag.tab', tab); } catch (er) {} render(); });
$('panel').addEventListener('click', e => {
  const g = e.target.closest('[data-give]'), fr = e.target.closest('[data-free]'), bd = e.target.closest('[data-build]');
  if (g) give(+g.dataset.give);
  if (fr) { const i = S.bucket.findIndex(b => b.id === fr.dataset.free); if (i >= 0) { S.bucket.splice(i, 1); save(); toast('Platsch! Und tschüss.'); render(); } }
  if (bd) { const b = BUILDS.find(x => x.id === bd.dataset.build); if (Object.entries(b.cost).every(([k, n]) => S.parts[k] >= n)) { Object.entries(b.cost).forEach(([k, n]) => { S.parts[k] -= n; }); S.built[b.id] = true; save(); SFX.catch(); toast(`${b.name} steht! Schau mal zum Steg.`); render(); } }
});
$('snd').addEventListener('click', () => { S.sound = !S.sound; save(); render(); });
// Versteckter Testregler: dreimal schnell auf die Uhr tippen
let taps = [];
$('clock').addEventListener('click', () => { const n = Date.now(); taps = taps.filter(x => n - x < 1200).concat(n); if (taps.length >= 3) { taps = []; $('test').hidden = !$('test').hidden; } });
$('phaseBtns').addEventListener('click', e => { const b = e.target.closest('[data-ph]'); if (!b) return; S.phase = b.dataset.ph || null; save(); render(); });
$('tNewDay').addEventListener('click', () => { S.wishSalt = String(Math.random()); S.wishes = null; save(); render(); toast('Ein neuer Tag beginnt.'); });
$('tCalm').addEventListener('click', () => { S.spots = {}; save(); render(); toast('Alle Stellen beißen wieder.'); });
let resetArm = 0;
$('tReset').addEventListener('click', e => { if (Date.now() - resetArm < 3000) { S = fresh(); save(); reset(); render(); e.target.textContent = 'Alles löschen'; toast('Alles auf Anfang.'); resetArm = 0; return; } resetArm = Date.now(); e.target.textContent = 'Wirklich? Nochmal tippen'; setTimeout(() => { e.target.textContent = 'Alles löschen'; }, 3000); });

setInterval(() => { if (!document.hidden) render(); }, 30000);
render(); updCast();
requestAnimationFrame(loop);
})();
</script>
