<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Landgang-Kampf</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--sea:#3a6a98;--ink:#fbf6ea;--wood:#2b1d14;--gold:#f2c94c;--red:#d8433a;--hp:#5aa24a;--kr:#e0483c;--te:#4a8fe0;--kl:#4cb85a;--px:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace}
html,body{margin:0;height:100%;background:var(--sea);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--px);color:var(--ink)}
#wrap{position:fixed;inset:0;overflow:hidden;background:var(--sea)}
canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 16px 0;pointer-events:none;display:grid;gap:6px;justify-items:center}
#tm{justify-self:center;background:rgba(43,29,20,.55);padding:2px 6px;border-radius:2px}
#netT{width:100%;max-width:420px}
@media(max-width:540px){#hud{padding-right:58px}}
.hpp{width:100%;max-width:420px;box-sizing:border-box;display:flex;align-items:center;gap:7px;background:linear-gradient(#8a5a30,#6e4524);border:3px solid var(--wood);border-radius:4px;box-shadow:0 3px 0 var(--wood),inset 0 2px 0 rgba(176,122,68,.6);padding:4px 7px 5px 4px}
.por{position:static;width:30px;height:30px;flex:none;background:#bcd3e6;border:2px solid var(--wood);box-shadow:inset 0 0 0 1px rgba(251,246,234,.5)}
.hbx{flex:1;min-width:0}
.hbx .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font:700 12px/1 var(--px);text-shadow:1px 1px 0 var(--wood);margin-bottom:4px;white-space:nowrap}
.hbx .nm small{font-size:10px;color:#ffe28a;margin-left:5px}
.hbx .num{font-size:11px;opacity:.95}.hbx .num b{font-size:13px}
.hbx>i{position:relative;display:block;height:10px;background:var(--wood);border:2px solid var(--wood);box-shadow:0 0 0 1px rgba(251,246,234,.4)}
.hbx>i>b{display:block;height:100%;background:var(--hp);transition:width .12s steps(3);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.25)}
.hpp.boss .hbx>i>b{background:#9b6fd1}
.hpp.low .hbx>i>b{animation:lowB .5s steps(1) infinite}
@keyframes lowB{50%{filter:brightness(1.5)}}
.hbx>i>em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffe28a}

.r1{display:flex;justify-content:space-between;align-items:baseline;font:700 11px/1 var(--px);text-shadow:1px 1px 0 var(--wood);margin-bottom:5px}
.r1 b{color:#c9a8ef}
#ph{font-size:10px;color:#ffe28a;margin-left:6px}
#tm{font:700 11px var(--px)}
.bar{position:relative;height:9px;background:var(--wood);border:2px solid var(--wood);box-shadow:0 0 0 1px rgba(251,246,234,.5)}
.bar b{display:block;height:100%;background:#9b6fd1;transition:width .12s steps(3)}
.bar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffe28a}
#netT{display:none;margin-top:6px;height:5px;background:var(--wood)}
#netT b{display:block;height:100%;background:#e8d8ff}
#ctl{position:fixed;z-index:5;right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);width:0;height:0;pointer-events:none}
#ctl .btn{position:absolute}
.pf:nth-child(1){right:27px;bottom:135px}.pf:nth-child(2){right:106px;bottom:102px}.pf:nth-child(3){right:139px;bottom:23px}
.kb{position:absolute;left:2px;bottom:21px;font:700 8px/1 var(--px);background:var(--wood);color:#ffe28a;padding:2px 3px;text-shadow:none;display:none}
@media (pointer:fine){.kb{display:block}}
#joy{position:fixed;z-index:4;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;opacity:.38;transition:opacity .15s}
#joy.on{opacity:1}
#joy canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#jB{left:0;top:0;width:120px;height:120px;filter:drop-shadow(0 4px 0 #2b1d1488)}
#jK{left:33px;top:33px;width:54px;height:54px;filter:drop-shadow(0 3px 0 #2b1d14aa)}
body.drag #joy{display:none}
@media (pointer:fine){#joy:not(.on){display:none}}
#gear{position:fixed;z-index:7;right:10px;top:calc(env(safe-area-inset-top) + 10px);width:34px;height:34px;min-width:0;min-height:0;padding:0;display:grid;place-items:center}
#gear canvas{width:24px;height:24px;image-rendering:pixelated}
#set{position:fixed;z-index:8;right:10px;top:calc(env(safe-area-inset-top) + 90px);display:none;background:#fbf6ea;color:var(--wood);border:3px solid var(--wood);border-radius:4px;box-shadow:0 4px 0 var(--wood);padding:8px;font:700 12px var(--px);width:180px}
#set.on{display:grid;gap:6px}
#set .btn{min-height:40px;width:100%;font-size:12px;background:#d9cfbc;color:var(--wood);text-shadow:none}
#set .btn.on{background:var(--gold)}
.pop.hl{color:#9be07a;text-shadow:1px 1px 0 #2f6a2e,2px 2px 0 var(--wood)}
.btn{pointer-events:auto;position:relative;min-width:64px;min-height:64px;border:3px solid var(--wood);border-radius:6px;background:#b07a44;color:var(--ink);font:700 12px/1.1 var(--px);text-shadow:1px 1px 0 var(--wood);box-shadow:0 4px 0 var(--wood);overflow:hidden;padding:6px 8px;touch-action:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood)}
.pf{width:58px;height:66px;min-width:0;padding:0;background:#5e3b1d}
.pf .ul{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sc);opacity:.55}
.pf .hp{position:absolute;left:5px;right:5px;top:5px;height:4px;background:var(--wood)}
.pf .hp b{display:block;height:100%;background:var(--hp)}
.pf .fa{position:relative;width:24px;height:20px;margin:16px auto 0;background:#e9b48a;border:2px solid var(--wood)}
.pf .fa:before{content:'';position:absolute;left:-6px;right:-6px;top:-9px;height:7px;background:var(--hat);border:2px solid var(--wood)}
.pf .fa:after{content:'';position:absolute;left:5px;top:6px;width:3px;height:4px;background:var(--wood);box-shadow:8px 0 0 var(--wood)}
.pf .nm{position:relative;display:block;margin-top:5px;font:700 10px var(--px)}
.pf .sr{position:absolute;right:4px;top:12px;width:7px;height:7px;border:2px solid var(--sc);border-radius:50%}
.pf.go{animation:glow .3s steps(2) infinite}
.pf.go .ul{opacity:.95}
.pf.off{filter:grayscale(.9) brightness(.65)}
@keyframes glow{50%{box-shadow:0 4px 0 var(--wood),0 0 0 4px #ffe28a}}
#bK{background:#5d6575;width:80px;height:80px;right:16px;bottom:16px;border-radius:10px}
#bK.ready{background:#f2c94c;color:var(--wood);text-shadow:none;animation:pulse .2s steps(2) infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 var(--wood),0 0 0 4px #ffe28a}}
#bK .win{position:absolute;left:0;bottom:0;height:7px;background:#d8433a;width:0;border-top:2px solid var(--wood)}
#bK .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(43,29,20,.6);height:0}
#bK .lb{position:relative}
#kTip{position:fixed;z-index:6;right:12px;bottom:calc(env(safe-area-inset-bottom) + 212px);font:700 12px/1.25 var(--px);background:#fbf6ea;color:var(--wood);border:3px solid var(--wood);border-radius:4px;box-shadow:0 3px 0 var(--wood);padding:6px 8px;pointer-events:none;display:none;max-width:170px;text-align:center}
#kTip:after{content:'';position:absolute;right:40px;bottom:-11px;border:8px solid transparent;border-top-color:var(--wood);border-bottom:0}
#kTip b{color:var(--red)}
#hint{position:fixed;z-index:4;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);font:700 11px/1.4 var(--px);background:rgba(43,29,20,.7);padding:4px 8px;border-radius:2px;pointer-events:none;text-align:center;white-space:nowrap}
#warn{position:fixed;z-index:3;font:700 18px var(--px);color:#ffe28a;text-shadow:2px 2px 0 var(--wood);pointer-events:none;transform:translate(-50%,-100%);display:none}
#ov2{position:fixed;inset:0;z-index:2;pointer-events:none}
.hb{position:absolute;width:26px;height:4px;margin-left:-15px;background:var(--wood);border:2px solid var(--wood);display:none}
.hb b{display:block;height:100%;background:var(--hp)}
.hb.e b{background:var(--red)}.hb.boss{width:40px;margin-left:-22px}.hb.boss b{background:#9b6fd1}
.hb.bd{border-color:#c9a8ef}
#fc{position:absolute;display:none;width:0;height:0;margin-left:-8px;border:8px solid transparent;border-top:10px solid #ffe28a;border-bottom:0;filter:drop-shadow(0 2px 0 #2b1d14)}
.say{position:fixed;z-index:4;max-width:150px;background:#fbf6ea;color:#2b1d14;border:3px solid #2b1d14;border-radius:4px;box-shadow:0 3px 0 #2b1d14;padding:4px 7px;font:600 11px/1.25 var(--px);pointer-events:none;transform:translate(-50%,-100%);text-align:center;animation:sayIn .18s steps(3)}
.say:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-5px;border:5px solid transparent;border-top:6px solid #2b1d14}
.say.out{opacity:0;transition:opacity .25s steps(3)}
@keyframes sayIn{from{transform:translate(-50%,-80%) scale(.6)}to{transform:translate(-50%,-100%) scale(1)}}
.pop{position:fixed;z-index:3;font:700 13px var(--px);color:var(--gold);text-shadow:1px 1px 0 #b8862a,2px 2px 0 var(--wood);pointer-events:none;transform:translate(-50%,-50%);animation:up .6s steps(4) forwards}
.pop.big{font-size:22px;color:#ffe28a;z-index:4}
.pop.me{color:#fbf6ea;text-shadow:1px 1px 0 var(--red),2px 2px 0 var(--wood)}
.pop.ef{font-size:16px;color:#ffe28a}
.pop.wk{font-size:11px;color:#d9cfbc}
.pop.ban{font-size:20px;background:rgba(43,29,20,.75);padding:4px 10px;border:2px solid var(--wood);white-space:nowrap;animation:ban 1.5s steps(8) forwards}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(1.3)}12%,80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) translateY(-14px);opacity:0}}
@keyframes up{to{transform:translate(-50%,-50%) translateY(-24px);opacity:.2}}
#ov{position:fixed;z-index:9;inset:0;display:none;align-items:center;justify-content:center;background:rgba(33,30,60,.55);padding:16px}
#card{background:#fbf6ea;color:var(--wood);border:3px solid var(--wood);border-radius:6px;box-shadow:0 5px 0 var(--wood);padding:16px;width:min(320px,100%);text-align:center}
#card h1{margin:0 0 4px;font:700 26px var(--px)}
#card p{margin:4px 0 12px;font:12px/1.45 var(--px)}
#card .row{display:grid;gap:8px}
#card .btn{width:100%;min-height:48px}
#chk{font:11px/1.4 var(--px);min-height:16px;margin-top:8px;word-break:break-all}
#chk.ok{color:#2f6a2e}#chk.bad{color:var(--red)}
/* Hoehle */
#cvL{display:none;font:700 11px/1 var(--px);background:rgba(43,29,20,.7);padding:4px 8px;border-radius:2px;text-shadow:1px 1px 0 var(--wood);white-space:nowrap}
body.cave #cvL{display:block}
.mt{display:inline-block;width:8px;height:8px;border:2px solid var(--wood);vertical-align:-2px;margin:0 3px 0 7px}
.mt.pl{background:repeating-linear-gradient(#b07a44 0 3px,#5e3b1d 3px 4px)}.mt.ei{background:#a9a2b4;border-radius:2px}.mt.se{background:#fbf6ea}
.coin{display:inline-block;width:8px;height:8px;border:2px solid #b8862a;border-radius:50%;background:var(--gold);vertical-align:-2px;margin-right:3px}
body.cave.noboss #bossP{display:none}
.pop.loot{color:#ffe28a;text-shadow:1px 1px 0 #b8862a,2px 2px 0 var(--wood)}
.pop.mat{color:#fbf6ea;text-shadow:1px 1px 0 #5e3b1d,2px 2px 0 var(--wood)}
#bK.rain{background:#f0a0c8;color:var(--wood);text-shadow:none;animation:pulse .2s steps(2) infinite}
#rp{position:fixed;z-index:6;top:calc(env(safe-area-inset-top) + 56px);left:50%;transform:translateX(-50%);font:700 12px var(--px);background:var(--red);padding:3px 8px;border:2px solid var(--wood);display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ov2"><div id="fc"></div></div>
<div id="hud">
  <div class="hpp boss" id="bossP"><canvas class="por" id="porB" width="12" height="12"></canvas><div class="hbx"><div class="nm"><span><span id="bN">Fadenmeister Marlo</span><small id="ph">Phase 1</small></span><span class="num"><b id="nB">0</b>/<span id="mB">0</span></span></div><i><b id="hpB"></b><em style="left:60%"></em><em style="left:25%"></em></i></div></div>
  <div id="cvL"></div>
  <div id="tm">0,0 s</div>
  <div id="netT"><b id="netB"></b></div>
</div>
<div id="rp">REPLAY</div>
<div id="warn">!!</div>
<div id="kTip"></div>
<div id="hint"></div>
<div id="joy"><canvas id="jB" width="40" height="40"></canvas><canvas id="jK" width="18" height="18"></canvas></div>
<button class="btn" id="gear" aria-label="Einstellungen"><canvas id="gC" width="12" height="12"></canvas></button>
<div id="set">Steuerung<button class="btn opt" data-v="joy">Steuerknopf</button><button class="btn opt" data-v="drag">Halten &amp; ziehen</button></div>
<div id="ctl">
  <div id="pfs"></div>
  <button class="btn" id="bK"><div class="win"></div><div class="cd"></div><div class="lb">Konter</div><span class="kb" style="left:auto;right:4px;top:4px;bottom:auto">Leer</span></button>
</div>
<div id="ov"><div id="card">
  <h1 id="ovT">Sieg!</h1><p id="ovP"></p>
  <div class="row">
    <button class="btn" id="bGo" style="display:none">Weiter</button>
    <button class="btn" id="bAgain">Nochmal</button>
    <button class="btn" id="bView">Replay ansehen</button>
    <button class="btn" id="bChk">Replay prüfen</button>
  </div>
  <div id="chk"></div>
</div></div>
<script src="../js/vendor/three.min.js"></script>
<script>
/*LOGIC*/
// Spiel-Logik Landkampf: ohne Grafik, ohne Math.random/Date. Fester Takt 30 Schritte/s.
// Zufall: Mulberry32 (Zustand in s.r). Eingaben: {step,type:'move',x,z} (Richtung, Laenge<=1) |
// {step,type:'steer',x,y} (Zielpunkt) | {step,type:'ult',i} | {step,type:'focus',id} | {step,type:'cut',k} | {step,type:'counter'}
var LK=(function(){
'use strict';
const HZ=30,DT=1/HZ,MAXSTEP=HZ*90;
const K={R:9.4,
  u:{cap:{hp:260,atk:11,cd:22,rng:0.95,v:3.4,rad:0.36},
     mate:{hp:110,atk:9,cd:26,rng:0.95,v:3.1,rad:0.36},
     kiki:{hp:95,atk:9,cd:30,rng:3.8,v:3.2,rad:0.34},
     grunt:{hp:80,atk:6,cd:34,rng:0.9,v:2.3,rad:0.36},
     boss:{hp:2000,atk:11,cd:48,rng:1.05,v:1.8,rad:0.65}},
  aggro:4.5,leash:6.5,
  ult:{hit:10,hurt:4,r:2.5,dmg:36},
  ring:{r:1.1,dmg:13,dur:48,cd:150,cdr:60,n:2,spread:1.4},
  net:{at:0.6,dur:180,per:3,bind:150,stun:90},
  rage:{at:0.25,spd:1.35,cd:0.7,ringCd:84,n:3},
  wind:{cd:170,cdr:60,first:60,dur:42,r:3.2,dmg:20,stun:90,cdmg:40,miss:30,stunMul:1.5},
  shot:{first:80,cd:120,cdr:60,rcd:105,aim:24,v:9,dmg:14,fan:0.3,min:2.2},
  crate:{hp:5,heal:30,hr:3},
  sling:{v:10,r:0.16,max:6.5,near:1.9,ur:4.2,udmg:30}};
// Deckung: c = Fels (Kreis), b = Stamm/Kiste (gedrehtes Rechteck); hp = zerstoerbare Kiste
const OB=[{k:'c',x:-3.6,z:2.2,r:1},{k:'c',x:3.9,z:1,r:0.9},{k:'c',x:-5.4,z:-4,r:1.15},{k:'c',x:5.2,z:-4.6,r:1},{k:'c',x:0.8,z:-7.2,r:0.85},{k:'c',x:6.2,z:4.8,r:0.8},
  {k:'b',x:0.4,z:3.4,hw:1.3,hd:0.3,a:0.15},{k:'b',x:-6.6,z:2.6,hw:1.1,hd:0.28,a:1.1},{k:'b',x:-1.8,z:-5.6,hw:1.2,hd:0.28,a:-0.4},
  {k:'b',x:2.6,z:5,hw:0.4,hd:0.4,a:0.2,hp:5},{k:'b',x:-4,z:-1,hw:0.4,hd:0.4,a:-0.3,hp:5}];
function rnd(s){s.r=(s.r+0x6D2B79F5)>>>0;let t=s.r;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
const cl=(v,a,b)=>v<a?a:v>b?b:v,r2=v=>Math.round(v*100)/100,dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
// Abstand + Normale Punkt -> Hindernis
function sdn(o,x,z){const dx=x-o.x,dz=z-o.z;
  if(o.k==='c'){const l=Math.hypot(dx,dz)||1e-6;return [l-o.r,dx/l,dz/l];}
  const c=Math.cos(o.a),s=Math.sin(o.a),lx=dx*c+dz*s,lz=-dx*s+dz*c,qx=Math.abs(lx)-o.hw,qz=Math.abs(lz)-o.hd;let d,nx,nz;
  if(qx>0||qz>0){const ax=Math.max(qx,0),az=Math.max(qz,0);d=Math.hypot(ax,az)||1e-6;nx=(lx<0?-1:1)*ax/d;nz=(lz<0?-1:1)*az/d;}
  else if(qx>qz){d=qx;nx=lx<0?-1:1;nz=0;}else{d=qz;nx=0;nz=lz<0?-1:1;}
  return [d,nx*c-nz*s,nx*s+nz*c];}
// Strahl bis zur ersten Deckung (fuer Zielhilfe + Bot)
function ray(s,x,z,dx,dz,max){for(let t=0;t<max;t+=0.1){for(const o of s.ob)if(!o.gone&&sdn(o,x+dx*t,z+dz*t)[0]<0.05)return t;}return max;}
// Mult: Kraft(0) > Technik(1) > Klinge(2) > Kraft(0)
const mult=(a,b)=>b===(a+1)%3?1.5:a===(b+1)%3?0.67:1;
function mk(s,side,kind,style,x,z,hm){const c=K.u[kind],mh=Math.round(c.hp*(hm||1));s.u.push({id:s.u.length,side,kind,style,x,z,vx:0,vz:0,h:side==='p'?-Math.PI/2:Math.PI/2,hp:mh,max:mh,cd:15+s.u.length*4,sw:0,tg:-1,ult:0,bound:0,as:0,dead:false});}
// Ausruestung der Crew: g = "a.h.u|a.h.u|a.h.u" (Prozent Schaden, Leben, Ulti-Ladung fuer Kapitaen, Brakk, Nele)
function wear(s,g){if(typeof g!=='string'||!/^(\d{1,3}\.\d{1,3}\.\d{1,3}\|){2}\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(g))return;
  g.split('|').forEach((p,i)=>{const[a,h,u]=p.split('.').map(v=>Math.min(200,+v)),U=s.u[i];if(!U)return;U.hp=U.max=Math.round(U.max*(1+h/100));U.am=1+a/100;U.um=1+u/100;
    let x=s.hash;for(const v of[a,h,u]){x^=v;x=Math.imul(x,16777619)>>>0;}s.hash=x;});}
// Werft (0-3): Kanonen +10 % Schaden, Segel +5 % Tempo pro Stufe fuer Kapitaen und Maats (ohne Ausbau unveraendert)
function yard(s,o){const k=Math.max(0,Math.min(3,o.kan|0)),g=Math.max(0,Math.min(3,o.segel|0));if(!k&&!g)return;
  for(const U of s.u)if(U.side==='p'){if(k)U.am=(U.am||1)*(1+0.1*k);if(g)U.vm=1+0.05*g;}}
// Fernkampf-Maatin Kiki (Schleuder): o.kiki = 1|2 ersetzt Brakk|Nele. Ohne kiki bleibt alles wie vorher (gleiche Pruefsumme).
function hire(s,o,pm){const k=o.kiki|0;if(k!==1&&k!==2)return;const u=s.u[k],c=K.u.kiki;u.kind='kiki';u.style=1;u.hp=u.max=Math.round(c.hp*pm);s.ps=[];
  s.hash=Math.imul(s.hash^(0x4b10+k),16777619)>>>0;}
// mv = Laufen (moveTo bzw. go in der Hoehle), t = Ziel (vom Aufrufer gewaehlt)
function kikiAI(s,u,mv,t){
  const c=K.u.kiki,S=K.sling,cap=s.u[0];

function startRain(s,b){const P=K.perla.rain,bs=s.bs,tg=[0,1,2].filter(j=>!s.u[j].dead),cap=s.u[0],a0=Math.atan2(cap.z-b.z,cap.x-b.x);

function pearlsT(s){const b=s.u[s.bi],P=K.perla.rain;

function separate(s){

      const ra=L.u[a.kind].rad,rb=L.u[b.kind].rad;let dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
      if(d>=ra+rb)continue;if(d<1e-4){dx=1;dz=(i-j)*0.1;d=Math.hypot(dx,dz);}
      const o=(ra+rb-d)/d,wa=rb/(ra+rb),wb=ra/(ra+rb);a.x-=dx*o*wa;a.z-=dz*o*wa;b.x+=dx*o*wb;b.z+=dz*o*wb;}}

function startNet(s){
  const tg=[1,2].filter(i=>!s.u[i].dead);if(!tg.length)tg.push(0);
  s.net={t:L.net.dur,tg,th:[]};for(const id of tg)for(let a=0;a<L.net.per;a++)s.net.th.push({u:id,a,cut:false});

function netTick(s){
  const n=s.net;n.t--;if(!n.th.every(x=>x.cut)&&n.t>0)return;
  let free=0;for(const id of n.tg){if(n.th.every(x=>x.u!==id||x.cut))free++;else s.u[id].bound=L.net.bind;}
  const res=free===n.tg.length?'gut':free>0?'mittel':'schlecht';s.stats.net=res;
  if(res==='gut'){s.bs.st='stun';s.bs.pt=L.net.stun;}else s.bs.st='move';

function rooms(s){const cap=s.u[0],n=s.R.length;
  s.R.forEach((q,i)=>{if(!q.act&&Math.hypot(cap.x-q.x,cap.z-q.z)<q.r-0.3)wake(s,i);
    if(q.act&&!q.cl&&i<n-1&&!s.u.some(u=>u.side==='e'&&!u.dead&&u.room===i)){q.cl=true;s.ev.push({k:'clear',i});

      for(const j of[1,2]){const m=s.u[j];if(m.dead){m.dead=false;m.hp=Math.round(m.max*0.3);m.bound=0;s.ev.push({k:'revive',id:j});}}

function phase(s){const b=s.u[s.bi],bs=s.bs;if(b.dead||!b.act)return;const f=b.hp/b.max;
  if(s.boss==='marlo'){if(s.ph===1&&f<=L.net.at){s.ph=2;startNet(s);}else if(s.ph===2&&f<=L.rage.at){s.ph=3;bs.wind=L.wind.first;bs.shot=Math.max(bs.shot,40);s.ev.push({k:'rage'});}}

      for(const sd of[-1,1]){const a=b.h+sd*1.4;mk(s,'e','crab',0,b.x+Math.cos(a)*1.3,b.z+Math.sin(a)*1.3,s.R.length-1).act=true;}s.ev.push({k:'call'});}});

function step(s,inputs){
  if(s.over)return s;
  s.ev=[];const U=s.u,cap=U[0],b=U[s.bi];
  for(const i of inputs||[])inp(s,i);

  else{
    if(s.kcd>0)s.kcd--;
    for(const u of U){if(u.dead)continue;if(u.cd>0)u.cd--;if(u.bound>0&&--u.bound===0)s.ev.push({k:'free',id:u.id});}
    if(!cap.bound){const v=L.u.cap.v;if(s.mv){const w=v*(cap.vm||1);accel(cap,s.mx*w,s.mz*w,w);}else go(s,cap,s.tx,s.tz,v,0.08);
      const f=s.focus>=0?U[s.focus]:null,t=f&&!f.dead&&dist(cap,f)<=reach(cap,f)?f:near(s,cap,'e',1.7);if(t)tryAtk(s,cap,t);else tryCrate(s,cap);}
    crewAI(s,U[1]);crewAI(s,U[2]);
    for(let i=3;i<U.length;i++){const u=U[i];if(u.dead||!u.act)continue;if(i===s.bi)(s.boss==='toni'?toniAI:s.boss==='perla'?perlaAI:marloAI)(s,u);else monAI(s,u);}

  }
  s.step++;

  let h=s.hash;const mix=v=>{h^=Math.round(v*1e4)|0;h=Math.imul(h,16777619)>>>0;};
  for(const u of U){mix(u.x);mix(u.z);mix(u.hp);mix(u.bound);mix(u.ult);}
  for(const p of s.shots){mix(p.x);mix(p.z);}if(s.ps)for(const p of s.ps){mix(p.x);mix(p.z);}for(const p of s.pearls){mix(p.x);mix(p.z);}for(const o of s.ob)if(o.hp)mix(o.hp);
  mix(s.r);mix(s.rings.length);mix(s.bs.pt);mix(s.focus);mix(s.loot.gold);s.hash=h;
