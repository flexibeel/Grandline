<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Offene See</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fbf6ea;--wood:#2b1d14;--wl:#b07a44;--wd:#8a5a30;--gold:#f2c94c;--red:#d8433a;--hp:#5aa24a;--px:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace}
html,body{margin:0;height:100%;background:#24375f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--px);color:var(--ink)}
#wrap{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.ui{transition:opacity .4s}
body.title .ui{opacity:0;pointer-events:none!important}
body.title .ui *{pointer-events:none!important}
.btn{pointer-events:auto;position:relative;border:3px solid var(--wood);border-radius:6px;background:var(--wl);color:var(--ink);font:700 13px/1.1 var(--px);text-shadow:1px 1px 0 var(--wood);box-shadow:0 4px 0 var(--wood),inset 0 -4px 0 rgba(43,29,20,.3),inset 0 3px 0 rgba(255,255,255,.18);padding:8px 12px;touch-action:none;cursor:pointer}
.btn:active,.btn.press{transform:translateY(3px);box-shadow:0 1px 0 var(--wood),inset 0 -4px 0 rgba(43,29,20,.3)}
#hud{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 8px);display:flex;gap:6px;pointer-events:none}
.plank{background:linear-gradient(#8a5a30,#6e4524);border:3px solid var(--wood);border-radius:4px;box-shadow:0 3px 0 var(--wood),inset 0 2px 0 rgba(176,122,68,.6);padding:5px 8px;font:700 12px/1 var(--px);text-shadow:1px 1px 0 var(--wood);display:flex;align-items:center;gap:6px;white-space:nowrap}
#hpBox{flex:1;min-width:0}
#hpBox i{flex:1;height:8px;background:var(--wood);border:2px solid var(--wood);box-shadow:0 0 0 1px rgba(251,246,234,.4);display:block;min-width:30px}
#hpBox i b{display:block;height:100%;background:var(--hp);transition:width .3s steps(4)}
#hpBox.low i b{background:var(--red)}
.coin{width:12px;height:12px;background:var(--gold);border:2px solid #b8862a;border-radius:50%;box-shadow:inset -2px -2px 0 #d9a33a;box-sizing:border-box;flex:none}
#gold.bump{animation:bump .3s steps(3)}
@keyframes bump{50%{transform:scale(1.25)}}
#comp{padding:3px}
#comp canvas{width:26px;height:26px;image-rendering:pixelated;display:block}
#menuB{width:38px;height:38px;padding:0;font-size:18px;border-width:3px;flex:none}
#menu{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 56px);display:none;background:#fbf6ea;color:var(--wood);border:3px solid var(--wood);border-radius:4px;box-shadow:0 4px 0 var(--wood);padding:10px;width:210px;font:700 12px/1.35 var(--px);z-index:20}
#menu.on{display:grid;gap:7px}
#menu .btn{width:100%;background:#d9cfbc;color:var(--wood);text-shadow:none;text-align:left}
#menu .btn.sel{background:var(--gold)}
#menu small{font-weight:400;opacity:.75}
#log{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 92px);font:700 11px/1.35 var(--px);text-shadow:1px 1px 0 var(--wood),0 0 3px rgba(43,29,20,.6);pointer-events:none}
.mt{display:inline-block;width:8px;height:8px;border:2px solid var(--wood);vertical-align:-2px;margin:0 3px 0 7px}
.mt.pl{background:repeating-linear-gradient(#b07a44 0 3px,#5e3b1d 3px 4px)}.mt.ei{background:#a9a2b4;border-radius:2px}.mt.se{background:#fbf6ea}
#goal{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 52px);pointer-events:auto;cursor:pointer;white-space:normal;line-height:1.25;color:var(--ink);text-align:left;padding:6px 8px}
#goal b{color:#ffe28a}#goal .q{margin-left:auto;flex:none;background:var(--wood);padding:2px 5px;border-radius:2px;font-size:10px}
#leg{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 94px);width:min(300px,calc(100% - 20px));box-sizing:border-box;display:none;background:#fbf6ea;color:var(--wood);border:3px solid var(--wood);border-radius:4px;box-shadow:0 4px 0 var(--wood);padding:10px;font:700 12px/1.3 var(--px);z-index:21;gap:6px}
#leg.on{display:grid}
.lg{display:flex;align-items:center;gap:10px}.lg span{position:relative;width:18px;height:18px;flex:none}
.lg span i{position:absolute;left:2px;top:2px;width:9px;height:9px;border:3px solid var(--wood);transform:rotate(45deg)}
.lg small{font-weight:400;opacity:.8}
@media (min-width:640px){#hud,#goal{left:0;right:0;margin:0 auto;max-width:420px}#log{left:calc(50% - 206px)}}
/* Werft */
#werft{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(24,22,48,.62);z-index:25;padding:16px}
#werft.on{display:flex}
#werft{align-items:flex-end;background:linear-gradient(rgba(24,22,48,0) 34%,rgba(24,22,48,.55) 58%);touch-action:none;cursor:grab}
#werft .wbox{max-height:min(58vh,560px);overflow-y:auto;cursor:default;touch-action:pan-y}
#wHint{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--wood);color:#fbf6ea;font:600 11px var(--px);padding:4px 10px;border-radius:3px;opacity:.85;pointer-events:none;white-space:nowrap}
body.wf #hud,body.wf #goal,body.wf #log,body.wf #joy,body.wf #act,body.wf #tip,body.wf #warn,body.wf #marks{display:none!important}
.wtab{display:flex;gap:6px}.wtab .btn{flex:1;font-size:12px;padding:6px;background:#6e4524;color:#fbf6ea}.wtab .btn.on{background:var(--gold);color:var(--wood);text-shadow:none}
.wcat{display:flex;gap:4px}.wcat .btn{flex:1;font-size:11px;padding:5px 2px;background:#fbf6ea;color:var(--wood);text-shadow:none}.wcat .btn.on{background:var(--gold)}
.wch{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.wc{background:#fbf6ea;border:3px solid var(--wood);border-radius:4px;padding:5px 3px;color:var(--wood);text-shadow:none;font:600 9px/1.15 var(--px);display:grid;justify-items:center;gap:3px;cursor:pointer;text-align:center;overflow-wrap:anywhere}
.wc canvas{width:32px;height:32px;image-rendering:pixelated}.wc small{font-weight:600;opacity:.75}.wc.sel{background:#ffe9a8;box-shadow:0 0 0 3px var(--gold)}.wc.on small{color:#2f8a3e;opacity:1}
#wBuy{width:100%;background:var(--gold);color:var(--wood);text-shadow:none;font-size:13px}#wBuy:disabled{filter:grayscale(.9);opacity:.6}
.wbox{width:min(360px,100%);box-sizing:border-box;background:linear-gradient(#8a5a30,#6e4524);border:4px solid var(--wood);border-radius:6px;box-shadow:0 6px 0 var(--wood),inset 0 3px 0 rgba(176,122,68,.6);padding:12px;display:grid;gap:8px;font:700 12px/1.3 var(--px);text-shadow:1px 1px 0 var(--wood)}
.wbox h3{margin:0;font:700 19px var(--px);color:#ffe28a;text-align:center;text-shadow:2px 2px 0 var(--wood)}
.wk{background:var(--wood);padding:6px 8px;border-radius:3px;display:flex;gap:4px 12px;flex-wrap:wrap;justify-content:center;align-items:center}
.wk .coin{display:inline-block;vertical-align:-2px;margin-right:4px}.wk .mt{margin-left:0}
.wr{background:#fbf6ea;color:var(--wood);text-shadow:none;border:3px solid var(--wood);border-radius:4px;padding:7px 8px;display:grid;grid-template-columns:40px 1fr auto;gap:3px 8px;align-items:center}
.wr b{font-size:14px}.wr small{font-weight:400;opacity:.8}
.pips i{display:inline-block;width:8px;height:8px;border:2px solid var(--wood);margin-left:3px;background:#d9cfbc;vertical-align:-1px}.pips i.on{background:var(--gold)}
.wr img{grid-row:1/4;width:40px;height:40px;image-rendering:pixelated;background:#7fb0d8;border:2px solid var(--wood);box-sizing:border-box}
.wr .btn{grid-row:1/4;grid-column:3;font-size:11px;line-height:1.25;padding:7px 8px;background:var(--gold);color:var(--wood);text-shadow:none;width:112px}
.wr .btn:disabled{filter:grayscale(.9);opacity:.55;cursor:default}
#wMap{font-weight:400;text-align:center;font-size:11px}
#wMap .btn{width:100%;background:#9be27a;color:var(--wood);text-shadow:none;font-size:14px}
#wGo{width:100%;min-height:42px}
#tL{font:700 13px/1.5 var(--px);position:relative;margin-top:4px}#tL:empty{display:none}
#tL .it{display:inline-block;padding:0 2px}#tL small{font-weight:400}.bes{display:inline-block;background:#9be27a;color:var(--wood);text-shadow:none;padding:0 4px;border-radius:2px;font-size:11px;margin-left:4px;animation:blink .6s steps(2) infinite}
/* Ausruestung */
#eq{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(24,22,48,.62);z-index:26;padding:12px}
#eq.on{display:flex}
#eq .wbox{width:min(400px,100%);max-height:calc(100% - 8px);overflow:hidden;grid-template-rows:auto auto auto auto 1fr auto}
.eT{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.eT .btn{min-height:36px;font-size:12px;padding:4px;background:#d9cfbc;color:var(--wood);text-shadow:none}.eT .btn.on{background:var(--gold)}
.eS{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ec{background:#fbf6ea;color:var(--wood);text-shadow:none;border:3px solid var(--wood);border-radius:4px;padding:4px;display:grid;justify-items:center;gap:2px;font:700 10px/1.15 var(--px);text-align:center;min-height:86px;cursor:pointer}
.ec img,.er img{width:32px;height:32px;image-rendering:pixelated;background:#e9dfcb;border:2px solid var(--rc,#2b1d14);border-radius:3px}
.ec small,.er small{font-weight:400;opacity:.85}.ec.empty{opacity:.55;cursor:default}
#eSum{font-size:11px;text-align:center;font-weight:400}
#eBag{overflow:auto;display:grid;gap:5px;align-content:start;min-height:60px;padding-right:2px}
.er{background:#fbf6ea;color:var(--wood);text-shadow:none;border:3px solid var(--wood);border-radius:4px;padding:5px;display:grid;grid-template-columns:36px 1fr auto;gap:2px 7px;align-items:center;font:700 11px/1.2 var(--px)}
.er img{grid-row:1/3}.er .d{font-size:10px}.er .up{color:#2f6a2e}.er .dn{color:#9a2a22}
.er .bb{grid-row:1/3;grid-column:3;display:grid;gap:4px}.er .bb .btn{font-size:10px;padding:4px 6px;min-height:0;background:var(--gold);color:var(--wood);text-shadow:none}.er .bb .btn.x{background:#d9cfbc}
#eBag:empty:before{content:'Noch nichts gefunden. Kisten und Bosse in Höhlen lassen Ausrüstung fallen!';font:400 11px/1.4 var(--px);text-align:center;padding:8px}
#marks{position:fixed;inset:0;pointer-events:none}
.mk{position:absolute;width:0;height:0}
.mk i{position:absolute;left:-9px;top:-9px;width:12px;height:12px;border:3px solid var(--wood);background:#ffe28a;transform:rotate(45deg);box-shadow:0 0 0 2px rgba(255,226,138,.35)}
.mk.blink i{animation:blink .6s steps(2) infinite}
.mk.bucht i{background:#b48ae0}.mk.home i{background:#9be27a;border-radius:2px}
.mk.foe i{background:var(--red)}.mk.cave i{background:#f08a24}.mk.spot i{background:#7fe0ff;border-radius:50%}
.mk em{position:absolute;left:-4px;top:-4px;width:0;height:0;border:4px solid transparent;border-left:7px solid var(--wood);transform-origin:4px 4px}
@keyframes blink{50%{background:#fff7d0;box-shadow:0 0 0 4px rgba(255,226,138,.6)}}
/* Steuerrad */
#joy{position:fixed;left:0;top:0;width:138px;height:138px;margin:-69px 0 0 -69px;pointer-events:none;opacity:.45;transition:opacity .15s}
#joy.on{opacity:1}
#joy canvas{position:absolute;left:0;top:0;width:138px;height:138px;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(43,29,20,.55))}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;will-change:transform}
#knob canvas{width:48px;height:48px;filter:drop-shadow(0 3px 0 rgba(43,29,20,.7))}
@media (pointer:fine){#joy:not(.on){display:none}}
#act{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 22px);min-width:104px;height:88px;border-radius:44px;padding:0 14px;display:none;place-items:center;text-align:center;font-size:12px;background:var(--gold);color:var(--wood);text-shadow:none;border-width:4px;animation:pulse .5s steps(2) infinite}
#act.on{display:grid}
#act b{display:block;font-size:26px;line-height:1;margin-bottom:2px}
#act.fight{background:var(--red);color:var(--ink);text-shadow:1px 1px 0 var(--wood)}
#act .key{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font:700 9px var(--px);background:var(--wood);color:var(--ink);padding:2px 4px;display:none}
@media (pointer:fine){#act .key{display:block}}
@keyframes pulse{50%{box-shadow:0 4px 0 var(--wood),0 0 0 5px rgba(255,226,138,.6)}}
#tip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 130px);transform:translateX(-50%);max-width:min(300px,calc(100% - 40px));background:#fbf6ea;color:var(--wood);border:3px solid var(--wood);border-radius:4px;box-shadow:0 3px 0 var(--wood);padding:7px 10px;font:700 12px/1.35 var(--px);text-align:center;display:none;pointer-events:none}
#tip.on{display:block;animation:tipIn .25s steps(3)}
@keyframes tipIn{from{transform:translate(-50%,12px);opacity:0}}
#warn{position:fixed;font:700 20px var(--px);color:#ffe28a;text-shadow:2px 2px 0 var(--wood);pointer-events:none;transform:translate(-50%,-100%);display:none;animation:blink2 .3s steps(2) infinite}
@keyframes blink2{50%{color:#ff7a5a}}
.pop{position:fixed;font:700 14px var(--px);color:var(--gold);text-shadow:1px 1px 0 #b8862a,2px 2px 0 var(--wood);pointer-events:none;transform:translate(-50%,-50%);animation:up .9s steps(6) forwards;white-space:nowrap}
.pop.hl{color:#9be27a;text-shadow:1px 1px 0 #2f6a2e,2px 2px 0 var(--wood)}
@keyframes up{to{transform:translate(-50%,-50%) translateY(-30px);opacity:0}}
.ban{position:fixed;left:50%;top:30%;font:700 20px var(--px);color:#ffe28a;text-shadow:2px 2px 0 var(--wood);background:rgba(43,29,20,.78);padding:6px 14px;border:3px solid var(--wood);border-radius:4px;white-space:nowrap;pointer-events:none;animation:ban 2.2s steps(10) forwards;transform:translate(-50%,-50%)}
.ban small{display:block;font-size:11px;color:var(--ink);margin-top:3px;text-align:center}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(1.35);opacity:0}10%,82%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) translateY(-16px);opacity:0}}
/* Truhe: Freischalt-Moment */
#truhe{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(24,22,48,.72);z-index:30;padding:16px;text-align:center}
#truhe.on{display:flex}
#rays{position:absolute;left:50%;top:42%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,226,138,.22) 0 12deg,transparent 12deg 30deg);border-radius:50%;animation:spin 8s steps(48) infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
#chest{position:relative;width:160px;height:128px;margin-top:-30px}
#chest canvas{position:absolute;left:0;width:160px;image-rendering:pixelated}
#chB{top:48px;height:80px}
#chL{top:16px;height:40px;transform-origin:50% 100%;transition:transform .35s steps(4)}
#truhe.open #chL{transform:translateY(-22px) rotate(-14deg)}
#chest.shake{animation:shake .12s steps(2) 4}
@keyframes shake{50%{transform:translateX(4px) rotate(2deg)}}
#tT{font:700 26px var(--px);color:#ffe28a;text-shadow:2px 2px 0 var(--wood),0 0 12px rgba(255,200,100,.5);margin-top:18px;position:relative}
#tS{font:700 13px/1.4 var(--px);margin:6px 0 4px;position:relative;max-width:300px}
#tG{font:700 22px var(--px);color:var(--gold);text-shadow:2px 2px 0 var(--wood);position:relative;display:flex;align-items:center;gap:8px;justify-content:center;min-height:30px}
#tG .coin{width:18px;height:18px;border-width:3px}
#tGo{margin-top:16px;min-width:170px;min-height:48px;opacity:0;transition:opacity .3s}
#truhe.done #tGo{opacity:1}
.cn{position:fixed;width:12px;height:12px;background:var(--gold);border:2px solid #b8862a;border-radius:50%;box-sizing:border-box;pointer-events:none;z-index:31}
#fade{position:fixed;inset:0;background:#18163a;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
</style>
</head>
<body class="title">
<div id="wrap"><canvas id="c"></canvas></div>
<div id="marks" class="ui"></div>
<div id="hud" class="ui">
  <div class="plank" id="hpBox"><span>Rumpf</span><i><b id="hpB"></b></i></div>
  <div class="plank"><span class="coin"></span><span id="gold">0</span></div>
  <div class="plank" id="comp" title="Kompass: zeigt nach Hause"><canvas id="compC" width="13" height="13"></canvas></div>
  <button class="btn" id="menuB" aria-label="Menü">☰</button>
</div>
<div class="plank ui" id="goal" role="button" tabindex="0"><span id="goalT">Ziel: …</span><span class="q">?</span></div>
<div id="log" class="ui"></div>
<div id="leg"></div>
<div id="menu">
  <div>Neue Welt · Beta</div>
  <button class="btn" data-m="ruhig">Ruhige Kamera: <span id="mRu">aus</span><br><small>Kein Wackeln, sanftes Folgen</small></button>
  <button class="btn" data-m="eq">Ausrüstung<br><small>Waffen, Kleidung, Schmuck der Crew</small></button>
  <button class="btn" data-m="leg">Legende<br><small>Was die Randzeichen heißen</small></button>
  <button class="btn" data-m="titel">Zum Titelbild<br><small>Fahrt wird gemerkt</small></button>
  <button class="btn" data-m="neu">Karte neu würfeln<br><small>Neue Inseln, Bord-Gold weg. Werft bleibt.</small></button>
  <small id="mInfo"></small>
</div>
<div id="werft"><div id="wHint">↔ Ziehen zum Drehen</div><div class="wbox"><h3>⚒ Werft</h3><div class="wtab"><button class="btn" data-t="aus">⚒ Ausbau</button><button class="btn" data-t="sch">🎨 Schmuck</button></div><div class="wk" id="wKasse"></div><div id="wRows" style="display:grid;gap:6px"></div><div id="wMap"></div><button class="btn" id="wGo">Ablegen</button></div></div>
<div id="joy" class="ui"><canvas id="wheel" width="46" height="46"></canvas><div id="knob"><canvas id="knobC" width="16" height="16"></canvas></div></div>
<button class="btn ui" id="act"><b id="actI">⚓</b><span id="actT">Anlegen</span><span class="key">E / Enter</span></button>
<div id="tip" class="ui"></div>
<div id="warn">!</div>
<div id="eq"><div class="wbox"><h3>🎒 Ausrüstung</h3><div class="eT" id="eTabs"></div><div class="eS" id="eSlots"></div><div id="eSum"></div><div id="eBag"></div><button class="btn" id="eGo">Fertig</button></div></div>
<div id="truhe"><div id="rays"></div><div id="chest"><canvas id="chB" width="32" height="16"></canvas><canvas id="chL" width="32" height="8"></canvas></div>
  <div id="tT">Schatz!</div><div id="tS"></div><div id="tG"><span class="coin"></span><span id="tGn">0</span></div><div id="tL"></div>
  <button class="btn" id="tGo">Weiter</button></div>
<div id="fade"></div>
<script src="../js/vendor/three.min.js"></script>
<script src="schmuck.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),TAU=Math.PI*2,QS=new URLSearchParams(location.search);
const EMB=parent!==window;
const tell=m=>{try{if(EMB)parent.postMessage(Object.assign({gl:1},m),location.origin);}catch(e){}};
if(!window.THREE){document.body.textContent='three.js konnte nicht laden';return;}
const hex=c=>new THREE.Color(c);
const C={k:'#2b1d14',w:'#fbf6ea',W:'#d9cfbc',V:'#a9a2b4',j:'#d9a35c',b:'#b07a44',B:'#8a5a30',d:'#5e3b1d',D:'#3f2628',r:'#d8433a',R:'#9a2a22',x:'#5e1f2a',
  f:'#ffe28a',y:'#f2c94c',Y:'#b8862a',o:'#f08a24',t:'#5d6575',T:'#363a4e',e:'#8a8478',E:'#5e5a54',sand:'#e0c68c',q:'#c9a8ef',p:'#9b6fd1',P:'#5e3a8a',g:'#5aa24a',G:'#2f6a2e'};
const cl=(v,a,b)=>v<a?a:v>b?b:v,wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a)),R=(a,b)=>a+Math.random()*(b-a);
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

function hullGeo(o){
  const N=9,secs=[];
  for(let i=0;i<=N;i++){const u=i/N,x=-o.L/2+u*o.L;
    let w=u<0.45?o.B*(0.8+0.2*Math.sin(u/0.45*Math.PI/2)):o.B*Math.pow(Math.max(0,Math.cos((u-0.45)/0.55*Math.PI/2)),0.75);if(i===N)w=0;

    secs.push([[x,yd,wi],[x,yt,w],[x,yt-o.band,w*0.99],[x,ym,w*0.86],[x,yk,0],[x,ym,-w*0.86],[x,yt-o.band,-w*0.99],[x,yt,-w],[x,yd,-wi]]);}
  const pos=[],col=[],cols=[o.bulw,o.band2,o.side,o.bot,o.bot,o.side,o.band2,o.bulw].map(hex),deck=hex(o.deck),tr=hex(o.transom);
  const A=new THREE.Vector3(),B=new THREE.Vector3(),Cc=new THREE.Vector3(),n=new THREE.Vector3(),e1=new THREE.Vector3(),e2=new THREE.Vector3();
  function tri(a,b,c,clr,ref){A.fromArray(a);B.fromArray(b);Cc.fromArray(c);e1.subVectors(B,A);e2.subVectors(Cc,A);n.crossVectors(e1,e2);if(n.lengthSq()<1e-9)return;
    let r=ref;if(!r){r=new THREE.Vector3((A.x+B.x+Cc.x)/3,(A.y+B.y+Cc.y)/3-(o.yt+o.yk)/2,(A.z+B.z+Cc.z)/3);r.x=0;}
    if(n.dot(r)<0){const t=B.clone();B.copy(Cc);Cc.copy(t);}
    for(const v of[A,B,Cc]){pos.push(v.x,v.y,v.z);col.push(clr.r,clr.g,clr.b);}}
  for(let i=0;i<N;i++){const r0=secs[i],r1=secs[i+1];for(let j=0;j<9;j++){const j2=(j+1)%9,dk=j===8,inw=j===0||j===7;let ref=null;if(dk)ref=new THREE.Vector3(0,1,0);else if(inw)ref=new THREE.Vector3(0,0.3,j===0?-1:1);
    tri(r0[j],r1[j],r1[j2],dk?deck:cols[j],ref);tri(r0[j],r1[j2],r0[j2],dk?deck:cols[j],ref);}}
  const s0=secs[0],cx=[s0[0][0],(o.yt+o.yk)/2-0.05,0];for(let j=0;j<9;j++)tri(cx,s0[j],s0[(j+1)%9],tr,new THREE.Vector3(-1,0,0));
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();return g;
}

function genWorld(seed){
  const r=rng(seed^0xA5A5A5),L=[{id:0,k:'hafen',x:0,z:0,r:5.2,w:0.7,name:'Heimathafen',s:0}];
  const kinds=['schatz','leer','bucht','schatz','schatz','bucht','leer','schatz','bucht','schatz'],pre=PRE.slice();
  for(let i=0,tries=0;i<kinds.length&&tries<4000;tries++){
    const a=r()*TAU,d=24+i*8.5+r()*12,x=Math.cos(a)*d,z=Math.sin(a)*d,k=kinds[i],rad=k==='bucht'?4.4:k==='schatz'?2.6:2.2+r()*0.8;
    if(Math.hypot(x,z)>WR-8||L.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+rad+14))continue;
    const n=pre.splice(Math.floor(r()*pre.length),1)[0];
    L.push({id:i+1,k,x,z,r:rad,w:r()*6,name:n+SUF[k],s:(r()*4294967296)>>>0});i++;}
  const E=[];
  for(let i=0,tries=0;i<FOES.length&&tries<4000;tries++){
    const a=r()*TAU,d=20+i*17+r()*10,x=Math.cos(a)*d,z=Math.sin(a)*d;
    if(Math.hypot(x,z)>WR-10||L.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+9))continue;
    E.push({id:i,name:FOES[i][0],bhp:FOES[i][1],look:FOES[i][2],cx:x,cz:z,orb:4+r()*4,ph:r()*TAU,dir:r()<0.5?-1:1,s:(r()*4294967296)>>>0,x,z,h:0,chase:0});i++;}
  const F=[];
  for(let i=0;i<18;i++){const a=r()*TAU,d=10+r()*(WR-16),x=Math.cos(a)*d,z=Math.sin(a)*d;if(L.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+3))continue;F.push({id:i,x,z,kind:r()<0.25?'rum':'gold',n:5+Math.floor(r()*11),ph:r()*6});}
  // Neu: eigener Zufallsstrom, damit alte Seekarten (Inseln, Gegner, Faesser) gleich bleiben
  const r2=rng(seed^0x0C4E5EED),cp=CPRE.slice();
  for(let i=0,tries=0;i<3&&tries<4000;tries++){
    const a=r2()*TAU,d=30+i*22+r2()*16,x=Math.cos(a)*d,z=Math.sin(a)*d,rad=3;
    if(Math.hypot(x,z)>WR-9||L.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+rad+12)||E.some(e=>Math.hypot(e.cx-x,e.cz-z)<rad+e.orb+3))continue;
    const n=cp.splice(Math.floor(r2()*cp.length),1)[0];
    L.push({id:11+i,k:'hoehle',x,z,r:rad,w:r2()*6,name:n+'grotte',s:(r2()*4294967296)>>>0,boss:BOSS[i][0],bn:BOSS[i][1],hid:i>0&&r2()<0.55});i++;}
  for(let i=0,tries=0;i<FOES2.length&&tries<4000;tries++){
    const a=r2()*TAU,d=24+r2()*(WR-40),x=Math.cos(a)*d,z=Math.sin(a)*d;
    if(L.some(o=>Math.hypot(o.x-x,o.z-z)<o.r+9)||E.some(e=>Math.hypot(e.cx-x,e.cz-z)<12))continue;
    E.push({id:5+i,name:FOES2[i][0],bhp:FOES2[i][1],look:FOES2[i][2],cx:x,cz:z,orb:4+r2()*5,ph:r2()*TAU,dir:r2()<0.5?-1:1,s:(r2()*4294967296)>>>0,x,z,h:0,chase:0});i++;}
  return {L,E,F};
}

  const L=WORLD.L,sch=L.filter(I=>I.k==='schatz'),cav=L.filter(I=>I.k==='hoehle'),anyUp=S.up.r+S.up.k+S.up.s>0;
  if(!sch.some(isDone))return sch.some(I=>S.found.includes(I.id))?['z1','Heb den <b>Schatz</b> auf der Glitzer-Insel ✦','Fahr nah ran und tipp auf <b>✦ Schatz heben</b>.']:
    ['z1','Finde die Insel mit dem <b>Glitzern</b>','Blinkende Rauten am Rand zeigen <b>unentdeckte Inseln</b>. Einfach hinsegeln!'];
  if(S.gold>=150&&!S.bank)return['z3','Bring dein Gold in den <b>Heimathafen</b> (grüne Raute)','Gold an Bord ist in Gefahr! Erst im <b>Heimathafen</b> ist es sicher.'];
  if(cav.length&&!cav.some(isDone)){const f=cav.find(I=>S.found.includes(I.id));
    return f?['z2','Betritt die <b>'+f.name+'</b> ⛏','Drinnen wartet <b>'+f.bn+'</b>. Beute: Gold und Material für die Werft.']:
      ['z2','Finde eine <b>Höhle</b>: Felsinsel mit Fackeln','Höhlen haben <b>orange</b> Randzeichen. Manche verstecken sich unter <b>glitzerndem Wasser</b> (blaue Kreise).'];}
  if(S.gold>0&&!S.bank)return['z3','Bring das Gold in den <b>Heimathafen</b>','Gold an Bord ist in Gefahr! Erst im <b>Heimathafen</b> ist es sicher.'];
  if(!anyUp)return S.bank>=120&&S.mats.pl+S.mats.ei+S.mats.se>0?['z4','Bau dein Schiff aus: <b>Werft</b> im Heimathafen ⚒','In der <b>Werft</b> machen Hafen-Gold + Material dein Schiff stärker.']:
    ['z4','Sammle <b>120 Gold</b> im Hafen + Material aus Höhlen','Die Werft braucht Hafen-Gold und Material (Planken, Eisen, Segeltuch).'];
  if(mapDone())return['z5','<b>Neue Seekarte</b> wartet im Heimathafen!','Alles erledigt. Im Hafen gibt\'s die nächste Seekarte. Gegner werden zäher.'];
  const left=L.filter(I=>I.id&&!I.done).length,boss=WORLD.E.find(e=>e.look==='boss'&&!e.dead);

}

const marks=new Map();
function mark(key,cls){let m=marks.get(key);if(!m){m=document.createElement('div');m.className='mk '+cls;m.innerHTML='<i></i><em></em>';$('marks').appendChild(m);marks.set(key,m);}m.className='mk '+cls;return m;}
function updMarks(){
  const seen=new Set(),w=innerWidth,h=innerHeight,top=Math.max($('goal').getBoundingClientRect().bottom,$('log').getBoundingClientRect().bottom)+16,bot=h-24,pad=24;
  const want=[];
  for(const I of WORLD.L){const d=Math.hypot(I.x-sh.x,I.z-sh.z);
    if(I.k==='hafen'){if(d>24)want.push(['i0',I.x,I.z,'home']);continue;}
    const found=S.found.includes(I.id);
    if(!found&&I.hid){if(d<55)want.push(['i'+I.id,I.x,I.z,'spot blink']);}
    else if(!found&&d<75)want.push(['i'+I.id,I.x,I.z,'blink']);
    else if(found&&!I.done&&I.k!=='leer'&&d<90)want.push(['i'+I.id,I.x,I.z,I.k==='bucht'?'bucht':I.k==='hoehle'?'cave':'']);}
  for(const E of WORLD.E)if(!E.dead&&E.chase>0)want.push(['e'+E.id,E.x,E.z,'foe blink']);
  const cx=w/2,cy=(top+bot)/2;
  for(const[key,x,z,cls]of want){const[sx,sy]=toScreen(x,0,z);
    if(sx>pad&&sx<w-pad&&sy>top&&sy<bot)continue;
    const dx=sx-cx,dy=sy-cy,k=Math.min(Math.abs((w/2-pad)/(dx||1e-6)),Math.abs(((bot-top)/2-6)/(dy||1e-6)));
    const m=mark(key,cls);seen.add(key);if(cls.includes('blink')&&!cls.includes('foe'))tip('zeichen','Blinkende <b>Raute am Rand</b> = unentdeckte Insel in dieser Richtung. Alle Zeichen: Menü ☰',7);m.style.left=(cx+dx*k)+'px';m.style.top=(cy+dy*k)+'px';
    m.lastChild.style.transform='rotate('+Math.atan2(dy,dx)+'rad) translateX(12px)';}
  for(const[k,m]of marks)if(!seen.has(k)){m.remove();marks.delete(k);}
}

    if(I.hid&&!fd){if(d<3){S.found.push(I.id);save();logLine();banner('Versteckte Höhle!',I.name+' taucht aus dem Glitzer auf.');crewJump(2);sparkle(I.x,1,I.z,30,'#7fe0ff');splash(I.x,I.z,24);flash=0.1;}continue;}
    if(d<10&&!fd){S.found.push(I.id);save();logLine();if(I.id){banner('Entdeckt: '+I.name,I.k==='bucht'?'Hier haust jemand. Die Fahne ist lila.':I.k==='schatz'?'Da glitzert was im Sand.':I.k==='hoehle'?'Fackeln am Fels. Da wohnt '+I.bn.split(' ').pop()+'.':'Sieht ruhig aus. Verdächtig ruhig.');crewJump(1);}}

  if(on&&near.k==='schatz')tip('heben','Nah genug! Tipp auf <b>Schatz heben</b>.',5);
  if(on&&near.k==='bucht')tip('bucht','Eine Bucht mit lila Fahne. <b>Landgang</b> startet einen Kampf an Land.',7);
  if(on&&near.k==='hoehle')tip('hoehle','<b>Höhle betreten</b>: drinnen gibt\'s Truhen, Material und einen Boss.',7);
  if(on&&near.k==='hafen')tip('werft','Im Hafen: Gold sichern, Rumpf flicken und in der <b>Werft</b> ausbauen.',7);
}
function doAct(){

    const g=S.gold;S.bank+=g;S.gold=0;S.hp=mhp();S.trips++;save();hudHp();setGold();logLine();
    if(g>0){truhe('Beute gesichert!','Die Crew feiert im Hafen. Rumpf geflickt.',g,0);afterTr=werft;}else werft();
  }else if(I.k==='schatz'){
    const g=60+Math.floor(rng(I.s)()*70);I.done=true;S.done.push(I.id);S.gold+=g;save();

    const g=3+Math.floor(rng(I.s)()*8);I.done=true;S.done.push(I.id);S.gold+=g;save();setGold();
    const J=['Nur Kokosnüsse. Und eine sehr stolze Krabbe.','Ein Zettel im Sand: „Bin gleich zurück.“','Hier war mal ein Schatz. Jetzt ist hier ein Loch.','Die Crew macht ein Nickerchen unter der Palme.'];

    else if(res.flee){const lost=Math.ceil(S.gold*0.15);S.gold-=lost;S.hp=cl(res.hp|0,1,mhp());E.chase=0;E.cool=25;
      {const dx=E.x-sh.x,dz=E.z-sh.z,l=Math.hypot(dx,dz)||1;E.x+=dx/l*6;E.z+=dz/l*6;}sh.v=Math.max(sh.v,2.5);save();hudHp();setGold();
      banner('Entkommen!',lost?lost+' Gold über Bord geworfen, damit ihr schneller seid.':'Puh. Weiter geht\'s.');}
    else{const lost=Math.ceil(S.gold/2);S.gold-=lost;S.hp=mhp();sh.x=1.9;sh.z=8.4;sh.h=Math.PI/2;sh.v=0;sh.w=0;camInit=false;E.chase=0;E.cool=20;save();hudHp();setGold();
      for(const v of wakeP)v.set(sh.x,sh.z,99,0);fadeIn();banner('Heimgeschleppt',lost?'Die Hälfte der Beute ist weg ('+lost+' Gold).':'Wenigstens war nichts an Bord.');}

    else{banner('Rückzug!','Marlo lacht noch. Versucht es später nochmal.');}

  if(x>=w/2-2&&x<=w/2+1&&y>=2&&y<=6)return y===2||y===6||x===w/2-2||x===w/2+1?C.k:C.f;return y<3?C.j:(y%5===0?C.B:x%9===0?C.B:C.b);});

  if(x===0||x===w-1||y===0||y===h-1||(y===1&&r>w/2-5))return C.k;const band=(x>=5&&x<=7)||(x>=w-8&&x<=w-6);if(band)return C.y;return y<3?'#c99a5c':C.B;});
