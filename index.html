<script>
  // Vorerst nur das helle Clean-Design (Dunkelmodus war nur halb umgebaut). Alte Einstellung entfernen.
  try { localStorage.removeItem('grandline.theme'); } catch (e) {}
</script>

<body>
<main>
  <header>
    <h1>Grand Line</h1>
    <div class="head-right">
      <div class="track" id="track" aria-label="Fortschritt"></div>
      <div class="head-actions">
        <button class="link" id="peek-btn" data-act="peek" hidden>Hauptquartier</button>
        <button class="link" data-act="intro-open">Anleitung</button>
        <button class="link" data-act="album">Sammelalbum</button>
        <button class="link" id="notes-btn" data-act="notes-open">Neuigkeiten</button>
        <button class="link" id="restart" data-act="restart">Neu starten</button>
        <button class="link fs-btn" data-act="fullscreen" hidden aria-label="Vollbild">⛶</button>
        <span id="mu-slot"></span>
        <button class="link rl-btn" data-act="reload" aria-label="Seite neu laden" title="Seite neu laden">↻</button>
      </div>
    </div>
  </header>
  <section id="synbar" class="synbar" hidden aria-label="Aktive Boni"></section>
  <div class="lbl crew-label" id="crew-label">Deine Crew</div>
  <section id="peek" class="peek-wrap" hidden aria-label="Hauptquartier-Kurzblick"></section>
  <section class="crew" id="crew"></section>
  <section id="syn" aria-label="Synergien und Schätze"></section>
  <section class="stage" id="stage"></section>
  <section id="album" class="album" hidden aria-label="Sammelalbum"></section>
  <section id="sheet" class="sheet" hidden aria-label="Steckbrief"></section>
  <section id="pcard" class="pcard-wrap" hidden aria-label="Spieler-Visitenkarte"></section>
  <nav id="tabbar" class="tabbar" hidden aria-label="Schnellzugriff"></nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <section id="intro" class="intro" hidden></section>
  <section id="title" class="title-screen" hidden></section>
  <footer class="fan">Inoffizielles Fanprojekt. Nicht verbunden mit Eiichiro Oda, Shueisha oder Toei Animation.
    One Piece und alle Figuren gehören ihren Rechteinhabern. Kostenlos und ohne kommerzielle Absicht.
    <a href="legal.html">Rechtliches &amp; Datenschutz</a></footer>
</main>
<aside id="traits" class="traits" hidden aria-label="Aktive Boni"></aside>
